name: Feature request
description: Something Link should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The job, not the solution. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What Link could do
  - type: markdown
    attributes:
      value: How ideas are judged is in [Architecture](https://docs.local.link/more/architecture#principles).
