# Releases lnk and its modules when the public workspace's version on
# main has no release yet: bump `version` in Cargo.toml in a
# PR, merge it, and this builds the `link` bundle through bundle.yml
# (lnk bundle, a prod build a target per runner, sealed by Link's signer
# `link`) and
# publishes it as v<version>, the latest release of the public
# so-local/link-releases repo. Signed public releases run only in the
# canonical source repository: QA mirrors and forks never enter the
# signing flow. Link's agents, each folder of agents/ready-made/ packed into
# link-<agent>.tar.gz by the bundle's own lnk, go on the same release.
# Users install with
#   curl -fsSL https://local.link/install.sh | sh
# and update with `lnk upgrade`, which installs only signed releases.
name: release

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "core/cli/install.sh"
      - "scripts/release/link-signers"
      - "modules/tooling/bundle/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/bundle.yml"
      - "**/module.toml"
      - "agents/**"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASES_REPO: so-local/link-releases

jobs:
  check:
    if: github.repository == 'so-local/link' && github.ref == 'refs/heads/main' && vars.LNK_SIGNED_RELEASES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          # The releases repo is public: reading it needs no secret.
          GH_TOKEN: ${{ github.token }}
        run: |
          # The first `version = "…"` line is [workspace.package].
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Every public member inherits the version lnk installs.
          if gh release view "v$version" -R "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "v$version is already released; bump the version to release again."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: check
    if: needs.check.outputs.needed == 'true'
    uses: ./.github/workflows/checks.yml

  # lnk and every module a release ships, a prod build compiled to trust
  # Link's signer, built a target per runner and sealed by it, after the
  # `bundle-link` environment's reviewer approves.
  bundle:
    needs: [check, checks]
    if: needs.check.outputs.needed == 'true'
    uses: ./.github/workflows/bundle.yml
    with:
      bundle: link
      signer: link
      targets: aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl

  # Link's agents, each folder of agents/ready-made/ packed into link-<agent>.tar.gz
  # by the sealed bundle's own lnk and its archive module, for the
  # ready-made agents people download from the same release.
  agents:
    needs: [check, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle
      - name: Pack Link's agents
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          dist=bundle/download/v$VERSION
          mkdir programs agents-dist
          for program in core archive agent; do
            tar -xzf "$dist/lnk-$program-x86_64-unknown-linux-musl.tar.gz" -C programs
          done
          for manifest in agents/ready-made/*/archive.toml; do
            agent=$(basename "$(dirname "$manifest")")
            programs/lnk archive export --from "agents/ready-made/$agent" \
              --to "agents-dist/link-$agent.tar.gz" </dev/null
          done
          ls -l agents-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agents
          path: agents-dist
          if-no-files-found: error

  # Publishes the sealed bundle. Only GitHub's own actions run here, and
  # only from main: the token is the `release` environment's, which only
  # main may deploy to, after its required reviewer approves.
  publish:
    needs: [check, bundle, agents]
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agents
          path: agents-dist
      - name: Publish v${{ needs.check.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          dist=bundle/download/v$VERSION
          [ "$(cat "$dist/VERSION")" = "$VERSION" ] || {
            echo "the bundle is $(cat "$dist/VERSION"), not $VERSION" >&2
            exit 1
          }
          ls -l "$dist"
          gh release create "v$VERSION" -R "$RELEASES_REPO" --latest \
            --title "lnk v$VERSION" \
            --notes "Install or update: \`curl -fsSL https://local.link/install.sh | sh\` (or \`lnk upgrade\`). Signed by Link's signer. Built from $GITHUB_REPOSITORY@$GITHUB_SHA." \
            "$dist"/* agents-dist/link-*.tar.gz
