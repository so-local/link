# Lint levels every package takes with `[lints] workspace = true`, on
# Clippy's default groups. A suppression says why:
# `#[expect(lint, reason = "...")]`, or `#[allow]` with its reason where the
# lint fires only on some configurations.
[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

