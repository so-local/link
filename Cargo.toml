[profile.dev]
debug = false
# Off so both workspaces' `target/` fit the 30 GB reference machine:
# the incremental cache was 8.4 GB of the public 15 GB. A one-line edit
# rebuilds in 3.7 s without it, against 1.6 s with it.
incremental = false

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

# What a release ships carries no symbol table: about a quarter of each
# program's bytes on disk. A panic still says its message and where; a
# backtrace names no functions.
[profile.release]
strip = true

# The copyright notice each generated file header carries: its holder
# and years, read by `link-docs-check-code`'s file catalogue.
[workspace.metadata.link.copyright]
holder = "Local Link Company"
years = "2026"

# A crate locked at a second version, and why. The repository checks
# (`link-repository-check`) fail on one listed nowhere here, and on one
# listed that is at one version again.
[workspace.metadata.second-versions]
base64 = "axum asks for 0.22; hyper-util for 0.23"
bitflags = "serde_with (ACP's schema) locks 1 for jiff's defmt, a feature Link never builds"
block-buffer = "axum's WebSockets ask for sha1 0.10, on RustCrypto's 0.10 line"
cpufeatures = "axum's WebSockets ask for sha1 0.10, on RustCrypto's 0.10 line"
crypto-common = "axum's WebSockets ask for sha1 0.10, on RustCrypto's 0.10 line"
digest = "axum's WebSockets ask for sha1 0.10, on RustCrypto's 0.10 line"
getrandom = "ring 0.17 asks for 0.2; rand_core 0.9 and tempfile for 0.3; rand 0.10 for 0.4"
hashbrown = "rusqlite's WebAssembly VFS (rsqlite-vfs 0.1) asks for 0.16, indexmap for 0.17"
indexmap = "serde_with (ACP's schema) locks 1 for a feature Link never builds"
nom = "lopdf (the document converter) asks for 8; tantivy-query-grammar for 7"
r-efi = "with getrandom"
rand = "axum's WebSockets (tungstenite 0.29) ask for 0.9"
rand_core = "with rand"
schemars = "typify 0.8 (link-api's generated types) asks for 0.8"
schemars_derive = "with schemars"
serde_derive_internals = "with schemars"
syn = "curve25519-dalek, phf and typify ask for 2"
webpki-roots = "tokio-tungstenite asks for 0.26, which only re-exports 1.0"
windows-sys = "ring 0.17 asks for 0.52, on Windows"

# The advisories against a locked version that stay, each by its id and
# why: no release fixes it. The repository checks fail on any other, an
# unmaintained crate's among them, and on one listed that no longer
# applies. An unmaintained crate is listed only where it reads no input
# from outside Link.
[workspace.metadata.advisories]
RUSTSEC-2026-0543 = "chrono is unmaintained: serde_with (ACP's schema) locks it for a feature Link never builds, so Link never runs it; Link's times are jiff's"
GHSA-g3hv-75wg-m249 = "minimatch 3.1.5 and 10.2.6, pinned to ^3 by eslint and to ^10 by typescript-estree, match only our own lint globs; the fix is in 11, which neither accepts"

# The npm scopes and maintainers whose packages are first-party, and why.
# The repository checks judge every other npm package by its downloads
# in the last week.
[workspace.metadata.trusted-npm-owners]
"@anthropic-ai" = "Anthropic's own scope: the Claude Agent SDK and API SDK"
"@modelcontextprotocol" = "the Model Context Protocol's own scope: its SDK"
"@next" = "Vercel's scope for Next.js's own packages"
"@vercel" = "Vercel's own scope"
"@tailwindcss" = "Tailwind Labs' own scope"
"@types" = "DefinitelyTyped's scope, TypeScript's types, published by Microsoft's bot"

# The crates.io owners whose crates are first-party: a team's GitHub
# organization (`github:tokio-rs:core` is tokio-rs) or a user, and why.
# The repository checks judge every other crate by its downloads.
[workspace.metadata.trusted-owners]
agentclientprotocol = "the Agent Client Protocol's own organization: its Rust SDK"
awslabs = "AWS's own organization: its Rust SDK and aws-lc-rs"
briansmith = "ring's and untrusted's author, who publishes them"
crossbeam-rs = "crossbeam's own organization"
dalek-cryptography = "curve25519-dalek's and subtle's own organization"
dtolnay = "the author and publisher of serde, syn, anyhow and thiserror"
googleapis = "Google's own organization: its Cloud client libraries"
hyperium = "hyper's and http's own organization"
kennykerr = "Microsoft's windows-rs author, who publishes windows-sys"
rust-lang = "the Rust project"
rust-lang-nursery = "the Rust project's crates in incubation: log, regex"
rust-lang-owner = "the Rust project's publishing account: libc, cc, hashbrown"
rust-random = "rand's and getrandom's own organization"
rustcrypto = "RustCrypto's own organization"
rustls = "rustls's own organization"
serde-rs = "serde's own organization"
smol-rs = "smol's own organization, async primitives tokio and hyper use"
tokio-rs = "tokio's own organization: tokio, axum, tracing, bytes, mio"
tower-rs = "tower's own organization"
unicode-org = "the Unicode Consortium: ICU4X"
wasm-bindgen = "wasm-bindgen's own organization"
