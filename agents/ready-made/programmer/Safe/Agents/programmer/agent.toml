# programmer: a coding agent working in one repository, the folder
# `lnk agent start --run.files` names. Only what differs from Link's defaults
# is set here, each with its reason.
schema = 1
harness = "link"
sandbox = true      # it runs commands, so every one runs in a sandbox
awake = true        # it stays ready for the next task

[behavior]

[behavior.model]
thinking = "medium"   # planning a change and reading a diff reward some reasoning

[behavior.model.anthropic]
default = "claude-sonnet-5-5"   # a model that holds a whole change in mind; Link's default is a small one

[behavior.turns]
rounds = 40   # a change is many rounds of read, edit and run; Link's 8 stops mid-task
calls = 80    # and a round may read or edit several files at once

[behavior.instructions]
owner = "none"   # programmer needs nothing of you beyond the task and the repository
# persona stays Link's default, instructions/persona.md: programmer's way of working.
# repository stays "link": the repository's AGENTS.md or CLAUDE.md is in its
# prompt, so the repository's own rules reach it before it edits.

[behavior.connections]
groups = "never"   # a programmer is asked in private, never pulled into a group chat

[behavior.tools]
timeout = "10m"    # every call waits as long as a build or test suite may run (Link's 5 minutes is less)

[behavior.tool.run]
enabled = true     # builds, tests, linters and git
timeout = "10m"    # a build or a test suite takes longer than Link's 2 minutes
output = "32 KB"   # enough of a failing log to read the first error and the last

[behavior.tool.file]
enabled = true     # reads and edits the repository's files

[behavior.tool.code]
enabled = true     # language servers (Link's defaults cover Rust, Go, Python, TypeScript, C/C++, Java and Kotlin)
