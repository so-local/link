# researcher: searches the web, reads what it finds and writes a cited
# report into its Home's reports folder. Its sandbox file grants Link
# Web, which fetches pages, and searches where Web has a search key.
# Only what differs from Link's defaults, where every tool is off, is
# set here.
schema = 1

# It reads your documents and writes its reports as files.
[behavior.tool.file]
enabled = true

# Every ready-made agent can schedule: a report on a cadence you ask for.
[behavior.tool.scheduler]
enabled = true
