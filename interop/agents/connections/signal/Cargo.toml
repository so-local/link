[package]
authors.workspace = true
name = "link-signal"
description = "The Signal connection, `lnk-signal`, lets your agent answer you in Signal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lnk-signal"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dependencies.link-harness-contract]
workspace = true

[dependencies.link-connection-contract]
workspace = true

[dependencies.link-core]
workspace = true
[dev-dependencies]
link-test-kit.workspace = true
link-core = { workspace = true}
# The agent on the mini harness every connection's tests run, from the core
# beside this folder.
link-harness-conformance = { workspace = true }

# No debug info: it was most of `target/` (a full `cargo test` wrote
# 20 GB with it). A panic still says where it happened; a backtrace names
# functions only.

[build-dependencies]
anyhow.workspace = true
link-actions-build.workspace = true
link-component-build.workspace = true

[build-dependencies.serde_json]
workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies.link-format]
workspace = true

[dependencies.link-secretive]
workspace = true

[dependencies.link-files]
workspace = true

[dependencies.link-settings]
workspace = true

[dependencies.link-runtime]
workspace = true

[dependencies.link-artifact]
workspace = true

[dependencies.link-fetch]
workspace = true

[dependencies.clap]
workspace = true

[dependencies.link-spec]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.link-actions]
workspace = true

[dependencies.link-types]
workspace = true
