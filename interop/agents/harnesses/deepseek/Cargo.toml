[package]
authors.workspace = true
name = "link-deepseek"
description = "The DeepSeek Harness adapter, `lnk-deepseek`, lets Local Link install, sandbox, and run DeepSeek Harness (`dsh`)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lnk-deepseek"
path = "src/main.rs"

[dependencies]
zstd.workspace = true
toml.workspace = true
link-sandbox-contract.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", features = ["sink"] }

[dependencies.link-harness-contract]
workspace = true

[dependencies.link-connection-contract]
workspace = true

[dependencies.link-harness-hub]
workspace = true

[dependencies.link-core]
workspace = true
[dev-dependencies]
link-test-kit.workspace = true
link-core = { workspace = true}
# Signals in the tests (already in the build, through tokio).
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json"] }
# The kit every harness is checked with, from the core.
link-harness-conformance = { workspace = true }
# The tests' own clock (`start_paused`).
tokio = { workspace = true, features = ["test-util"] }

# No debug info: it was most of `target/` (a full `cargo test` wrote
# 20 GB with it). A panic still says where it happened; a backtrace names
# functions only.

[dev-dependencies.link-sandbox-contract]
workspace = true

[build-dependencies]
anyhow.workspace = true
link-actions-build.workspace = true
link-component-build.workspace = true

[build-dependencies.serde_json]
workspace = true

[lints]
workspace = true

[dependencies.link-files]
workspace = true

[dependencies.link-format]
workspace = true

[dependencies.link-settings]
workspace = true

[dependencies.link-runtime]
workspace = true

[dependencies.link-artifact]
workspace = true

[dependencies.link-secretive]
workspace = true

[dependencies.link-fetch]
workspace = true

[dependencies.clap]
workspace = true

[dependencies.link-spec]
workspace = true

[lib]
doctest = false

[dependencies.link-actions]
workspace = true

[dependencies.link-types]
workspace = true
