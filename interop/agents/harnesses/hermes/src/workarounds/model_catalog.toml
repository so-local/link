            _best_effort(_log_context, "format_context_for_log failed: %s")
            _best_effort(_diagnostic, "spawn_async_diagnostic failed: %s")
'''
after = '''
            _best_effort(_log_context, "format_context_for_log failed: %s")
            # Link stops this gateway with its process group: nothing detached outlives it.
'''

