# A hosted provider behind Link's loopback relay is not a local model server.
# Keep all metadata probes on its inference API instead of probing Ollama,
# LM Studio and llama.cpp routes that the hosted capability correctly refuses.
# A model on this machine, at the address Link hands Hermes, is behind Link's
# local-model route, which serves inference and a few read-only paths: its
# server-type waterfall and Ollama's /api/show are refused there, and failed
# detection probes again each turn until the sandbox stops the route.
[[patches]]
path = "agent/model_metadata.py"
before = '''
def _normalize_base_url(base_url: str) -> str:
    return (base_url or "").strip().rstrip("/")
'''
after = '''
def _link_hosted_relay(base_url: str) -> bool:
    try:
        parsed = urlparse((base_url or "").strip())
        return (parsed.scheme == "http"
                and parsed.hostname in {"127.0.0.1", "localhost", "::1"}
                and parsed.path.rstrip("/") in {"/_link/model", "/_link/model/v1"}
                and parsed.username is None and parsed.password is None
                and not parsed.query and not parsed.fragment)
    except ValueError:
        return False


def _link_local_route(base_url: str) -> bool:
    import os
    given = (os.environ.get("LNK_HERMES_MODEL_URL") or "").strip().rstrip("/")
    if not given or _link_hosted_relay(given):
        return False
    asked = (base_url or "").strip().rstrip("/")
    return asked.removesuffix("/v1") == given.removesuffix("/v1")


def _normalize_base_url(base_url: str) -> str:
    normalized = (base_url or "").strip().rstrip("/")
    if _link_hosted_relay(normalized) and not normalized.endswith("/v1"):
        normalized += "/v1"
    return normalized
'''

