        path = (parsed.path or "").rstrip("/").lower()
        return path.endswith("/anthropic") or path.endswith("/anthropic/v1")
    except Exception:
        return False
'''
after = '''
def _is_anthropic_compatible_host(url: str) -> bool:
    """True for native Anthropic hosts and gateways serving Messages under a ``/anthropic`` path
    (same convention as runtime_provider / ``_wrap_if_needed``), so a configured ``model.base_url``
    whose gateway holds auth is not discarded. A bare non-Anthropic base_url is False."""
    if not url:
        return False
    from agent.model_metadata import _link_hosted_relay
    if _link_hosted_relay(url):
        return True
    try:
        parsed = urlparse(url)
        if (parsed.hostname or "").strip().lower().rstrip(".") in _ANTHROPIC_COMPATIBLE_HOSTS:
            return True
        path = (parsed.path or "").rstrip("/").lower()
        return path.endswith("/anthropic") or path.endswith("/anthropic/v1")
    except Exception:
        return False
'''

# Link owns this profile's foreground gateway. A reconnect after its death
# must fail instead of silently starting a daemon outside that ownership.
[[patches]]
path = "hermes_cli/gateway_client.py"
before = '''
        # A client's own start: the daemon it may launch ends itself once idle (no client, adapter,
        # cron/kanban work or admission), and the next client starts a fresh one.
        result = await asyncio.to_thread(ensure_gateway_runtime, home, idle_exit=True)
'''
after = '''
        # A client's own start: the daemon it may launch ends itself once idle (no client, adapter,
        # cron/kanban work or admission), and the next client starts a fresh one.
        if os.environ.get("LNK_HERMES_MANAGED_GATEWAY") == "1":
            from hermes_cli.gateway_runtime import discover_gateway_endpoint, DEFAULT_ENSURE_TIMEOUT
            deadline = time.monotonic() + DEFAULT_ENSURE_TIMEOUT
            result = await asyncio.to_thread(discover_gateway_endpoint, home)
            while result.state == "starting":
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    break
                await asyncio.sleep(min(0.05, remaining))
                result = await asyncio.to_thread(discover_gateway_endpoint, home,
                                                timeout=min(2.0, max(0.001, deadline - time.monotonic())))
        else:
            result = await asyncio.to_thread(ensure_gateway_runtime, home, idle_exit=True)
'''

# Link owns this profile's foreground gateway and stops it with its process
# group. Its shutdown diagnostic starts `timeout 5 bash -c 'ps; pstree; dmesg'`
# in a session of its own, outside that group, running programs its sandbox
# never grants (`timeout` first): the stop is refused and leaves it behind.
# Only Link runs this payload, and Link's own logs say why it stopped.
[[patches]]
