def build_model_state(model: str, provider: str, base_url: str) -> SessionModelState | None:
'''
after = '''
def _link_cached_model_picker(build):
    from functools import wraps
    @wraps(build)
    def cached(*args, **kwargs):
        from agent.models_dev import _link_cached_picker
        token = _link_cached_picker.set(True)
        try:
            return build(*args, **kwargs)
        finally:
            _link_cached_picker.reset(token)
    return cached

@_link_cached_model_picker
def build_model_state(model: str, provider: str, base_url: str) -> SessionModelState | None:
'''

