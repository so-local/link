[package]
authors.workspace = true
name = "link-agent"
description = "The `lnk agent` module starts, uses, connects, and moves an agent"
version.workspace = true
edition.workspace = true
license.workspace = true
# One test program, tests/main.rs, with every file a module of it.
autotests = false

[[test]]
name = "harness"
path = "tests/main.rs"

[[bin]]
name = "lnk-agent"
path = "src/main.rs"

[dependencies]
link-api.workspace = true
link-id.workspace = true
link-agent-contract = { workspace = true, features = ["moving", "action-client"] }
link-sandbox-route.workspace = true
anyhow.workspace = true
# The pushed way in: an agent's webhooks' posts, on 127.0.0.1.
axum.workspace = true
clap.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["json", "query", "rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit = "0.25"

# lnk agent move carries a harness's state as a tar stream; no xattrs, the
# same on macOS and Linux.
tar = { version = "0.4", default-features = false }
# Memory's index moves as SQLite's online backup of it, consistent while
# memory writes: never the live file and its `-wal`.
rusqlite = { version = "0.41", features = ["bundled", "backup"] }

[dependencies.link-archive]
workspace = true

[dependencies.link-archive-contract]
workspace = true

[dependencies.link-workplace]
workspace = true

[dependencies.link-harness-contract]
workspace = true

[dependencies.link-measure-contract]
workspace = true

[dependencies.link-agent-identity]
workspace = true

[dependencies.link-sandbox-client]
workspace = true

[dependencies.link-secret-contract]
workspace = true

[dependencies.link-sandbox-binding]
workspace = true

[dependencies.link-interactions-contract]
workspace = true

[dependencies.link-connection-policy]
workspace = true

[dependencies.link-model-contract]
workspace = true

[dependencies.link-sandbox-bridge]
workspace = true

[dependencies.link-interactions]
workspace = true

[dependencies.link-connection-contract]
workspace = true

[dependencies.link-agent-spec]
workspace = true

[dependencies.link-agent-team]
workspace = true

[dependencies.link-store-contract]
workspace = true
# A files bridge for its teams whose folders an account hosting agents keeps,
# and compact conversations read whole for an archive.
features = ["files-bridge", "compact"]

[dependencies.link-harness-wire]
workspace = true

[dependencies.link-run-tool-contract]
workspace = true

[dependencies.link-web-tool-contract]
workspace = true

[dependencies.link-file-tool-contract]
workspace = true

[dependencies.link-code-tool-contract]
workspace = true

[dependencies.link-desktop-tool-contract]
workspace = true

[dependencies.link-browser-tool-contract]
workspace = true

[dependencies.link-memory-tool-contract]
workspace = true

[dependencies.link-scheduler-tool-contract]
workspace = true

[dependencies.link-storage-contract]
workspace = true

[dependencies.link-core]
workspace = true

[dependencies.link-env-contract]
workspace = true

[dependencies.link-box-contract]
workspace = true

[dependencies.link-sandbox-contract]
workspace = true

[dependencies.link-service]
workspace = true

[dev-dependencies]
# Reading what an archive holds, in the archive tests.
flate2 = "1"
link-archive.workspace = true
# A harness's ACP, faked, for the bridge's tests.
link-connection-contract = { workspace = true, features = ["test-support"] }
link-test-kit.workspace = true
link-agent-contract = { workspace = true, features = ["test-support"] }
link-store-contract = { workspace = true, features = ["test-support"] }
futures-util.workspace = true
# The test every bridge passes (`link_sandbox_bridge::conformance`).
link-sandbox-bridge = { workspace = true, features = ["conformance"] }

[build-dependencies]
link-component-build.workspace = true
link-actions-build.workspace = true
anyhow.workspace = true

[dependencies.link-actions]
workspace = true

[dependencies.link-machine]
workspace = true

[dependencies.link-agent-place]
workspace = true

[dependencies.link-cloud-contract]
workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies.link-files]
workspace = true

[dependencies.link-format]
workspace = true

[dependencies.link-secretive]
workspace = true

[dependencies.link-spec]
workspace = true

[dependencies.link-runtime]
workspace = true

