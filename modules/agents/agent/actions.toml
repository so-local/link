[actions."agent.agent.start"]
description = """
Start your agent (Link Harness by default), in the background

Installs the harness the first time, gives it your settings, and keeps
it running, sandboxed, and enables startup at login after a reboot.
With no agent here, it creates the first, Onboarding, which answers
what Local Link can do. With several, `--agent` names one and `--all`
starts every one. It ends with what `lnk agent show` shows, then
`lnk agent chat` to talk to it.

A hosted model's API key comes from its provider's variable,
`ANTHROPIC_API_KEY`, `OPENAI_API_KEY` or `OPENROUTER_API_KEY`, or is
asked for in the terminal, and is kept with the agent's settings: no
flag takes it, since other users of this machine can see a command
line. `ANTHROPIC_API_KEY=... lnk agent start` sets or renews it.
"""
resource = "agent"
role = "primary"
output = "core.report"
spec = "agent"
docs = "/agents#start-your-agent"
next = ["agent.chat.start", "agent.agent.show", "agent.tool.add", "agent.harness.set", "agent.model.set", "agent.agent.connect", "agent.log.show", "agent.agent.stop", "agent.agent.move", "agent.agent.start", "agent.tool.list"]
