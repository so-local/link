Give --message, or pipe the message on stdin. For a live conversation,
use `lnk agent chat`. While it answers, `--queue` sends the message after
that answer, `--steer` lets it join the answer, and `--aside` asks a side
question kept out of the conversation. `--team` messages a team through
its lead, or `--member`. `--to` sends as the agent instead, to its owner
or a teammate. Each answer shows as it's written; Ctrl-C
stops waiting for it. It exits nonzero when the agent is stopped,
fails or doesn't answer. An answer nobody waited for in the chat (a
reminder, a turn you stopped) comes at the next message on it. An agent
on a box answers from there, and one a cloud account hosts through that
account's adapter, whose answers nobody waited for stay there. With a
harness that speaks its own connections, this says so.
"""
resource = "agent"
rest-args = ["agent", "chat", "message"]
role = "secondary"
output = "chat-event"
stream = true
docs = "/agents/chat#talk-to-it-here"
next = ["agent.chat.show", "agent.chat.list", "agent.chat.fork", "agent.agent.show"]
fail = ["agent.chat.send", "agent.chat.start", "agent.agent.show", "core.module.list", "agent.agent.connect", "agent.harness.set", "agent.agent.start", "agent.log.show"]

[actions."agent.chat.send".args]
action = { type = "string", description = "Run one agent action, such as model:show, then exit", x-link-cli = { conflicts = ["message", "aside", "queue", "steer", "to"] } }
aside = { type = "boolean", description = "Ask it as a side question, answered apart and kept out of the conversation", x-link-cli = { requires = ["message"], conflicts = ["queue", "steer", "team", "to"] } }
chat = { type = "string", description = "A chat (`lnk agent chat list`), such as `link:<name>` [default: main; with --team, one for that team; with --to, the owner's chat to reply in, or the chat for a teammate's reply]" }
cloud = { x-link-cli = { shared = "cloud" } }
connection = { type = "string", description = "With --to owner: where to message the owner, a connected service, or `cli` for this computer's `lnk agent chat`", x-link-cli = { requires = ["to"], conflicts = ["chat"] } }
json = { x-link-cli = { shared = "json" } }
member = { type = "string", description = "With --team: a unique member name within the team [default: its selected lead]", x-link-cli = { requires = ["team"] } }
message = { type = "string", description = "Send this one message, print the answer and exit. On the command line,\nother processes here can read it; on stdin they can't", x-link-cli = { short = "m" } }
queue = { type = "boolean", description = "Send it after the answer being written", x-link-cli = { requires = ["message"], conflicts = ["steer", "team", "to"] } }
steer = { type = "boolean", description = "Let it join the answer being written", x-link-cli = { requires = ["message"], conflicts = ["team", "to"] } }
stream-json = { type = "boolean", description = "Stream each event as a line of JSON for a remote client: its text as it comes, then how it ended", x-link-cli = { conflicts = ["json"] } }
team = { type = "string", description = "Message this team through its lead (`lnk agent team list`), or team@account for hosting", x-link-cli = { conflicts = ["to"] } }
to = { type = "string", description = "Send as the agent: `owner`, or a teammate as `teammate:<name or ID>`", pattern = "^(owner|teammate:.+)$", x-link-cli = { requires = ["message"], conflicts = ["stream-json"] } }

