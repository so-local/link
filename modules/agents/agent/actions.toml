[actions."agent.permission.add"]
description = """
Let your agent do more, whichever harness runs it: a specification's flags

The flags `lnk sandbox run` takes, added to its sandbox file: `add
--internet.hosts api.anthropic.com` a host its proxy lets it reach,
`--internet.tcp github.com:22` an endpoint beyond HTTPS and HTTP (git over SSH, a
database), `--tools.names gh` a tool that runs outside the sandbox (`lnk
sandbox tool add`), `--internet.per_minute 600` at most that many calls a minute,
`--files.read ~` your whole home, `--network.mode host` this machine's network
as it is. Restarts it if it runs.
"""
resource = "agent"
role = "secondary"
output = "core.report"
spec = "sandbox.sandbox"
docs = "/tooling/sandbox/permissions#choose-what-your-agent-can-reach"
next = ["agent.permission.remove"]
fail = ["agent.agent.show", "core.module.list", "agent.permission.add", "agent.agent.start"]

[actions."agent.permission.remove"]
description = """
Take a grant of your agent's away again: a specification's flags

Each item the flags name leaves its sandbox file: `remove --internet.hosts
'*'` the internet, `--internet.tcp github.com:22` an endpoint, `--tools.names gh` a tool,
`--internet.per_minute 600` its limit of calls, `--network.mode host` the network
as it is (back to its proxy). Restarts it if it runs.
"""
resource = "agent"
role = "secondary"
output = "core.report"
spec = "sandbox.sandbox"
docs = "/tooling/sandbox/permissions#choose-what-your-agent-can-reach"
next = ["agent.permission.add"]
fail = ["agent.agent.show", "core.module.list", "agent.agent.start", "agent.harness-permission.remove"]

