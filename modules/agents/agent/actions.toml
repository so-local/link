schema = 1

# Every action takes the agent it acts on.
[args]
agent = { type = "string", format = "link-id", x-link-kind = "agent", description = "The agent, by its ID, agent:<id>; on the command line its name too, which is looked up in your agents and sent as its ID [default: the only one here]", x-link-cli = { short = "a" } }

[verbs]
action-bridge = { description = "Serve proved namespace actions outside agent sandboxes", effect = "insert" }
agent = { description = "Hand a task to a subagent of the agent", effect = "insert" }
ask = { description = "Ask a question on the side, outside the conversation", effect = "insert" }
backup = { description = "Save a copy of something to bring back later", effect = "insert" }
bridge = { description = "Carry the agent's connections for a harness that speaks none", effect = "insert" }
bridges = { description = "Run the bridges an agent's sandbox reaches", effect = "insert" }
chat = { description = "Ask a model for one answer", effect = "insert" }
click = { description = "Click a point or an element", effect = "update" }
close = { description = "Close what the tool has open", effect = "delete" }
compact = { description = "Shorten a conversation now, keeping what matters", effect = "update" }
context = { description = "Show what a model is given", effect = "find" }
context-mcp = { description = "Serve an agent's context to its harness over MCP", effect = "insert" }
count = { description = "Count a request's tokens", effect = "find" }
definition = { description = "Find where a symbol is defined", effect = "find" }
deliver = { description = "Deliver what waits for a harness", effect = "insert" }
diagnostics = { description = "Show a file's errors and warnings", effect = "find" }
drag = { description = "Drag from one point to another", effect = "update" }
edit = { description = "Replace text in a file", effect = "update" }
embed = { description = "Turn text into vectors", effect = "insert" }
export = { description = "Write something out for another program or machine", effect = "insert" }
fetch = { description = "Fetch a page", effect = "find" }
fork = { description = "Start a new conversation from this one", effect = "insert" }
glob = { description = "Find files by a glob", effect = "find" }
goal = { description = "Pursue a goal until it's met", effect = "insert" }
grep = { description = "Find lines by a regular expression", effect = "find" }
join = { description = "Become a member", effect = "insert" }
key = { description = "Press a key", effect = "update" }
leave = { description = "Stop being a member", effect = "delete" }
left = { description = "Record that something left this machine", effect = "insert" }
links = { description = "Show what links to a note, and what it links to", effect = "find" }
migrate = { description = "Move an agent from its harness's own setup into Link", effect = "insert" }
move = { description = "Move something to another machine", effect = "update" }
needs = { description = "Say what a start needs", effect = "find" }
open = { description = "Open a page", effect = "insert" }
pause = { description = "Pause the agent's turns", effect = "update" }
plan = { description = "Plan the steps of a task", effect = "insert" }
queue = { description = "Queue your next message after the answer", effect = "insert" }
read = { description = "Read something", effect = "find" }
receive = { description = "Take in what another machine sends", effect = "insert" }
reconcile = { description = "Bring tasks in line with what ran", effect = "update" }
references = { description = "Find where a symbol is used", effect = "find" }
remember = { description = "Write a note to keep", effect = "update" }
rename = { description = "Give something a new name", effect = "update" }
reset = { description = "Put something back as it was", effect = "update" }
restart = { description = "Stop and start again", effect = "update" }
restore = { description = "Bring something back from a backup", effect = "update" }
resume = { description = "Resume an earlier conversation, or the agent's turns", effect = "update" }
rotate = { description = "Replace a secret with a new one", effect = "update" }
route = { description = "Route one action's call", effect = "insert" }
screenshot = { description = "Take a picture of the screen", effect = "find" }
scroll = { description = "Scroll", effect = "update" }
search = { description = "Search", effect = "find" }
secret = { description = "Hand a harness a secret it uses", effect = "insert" }
select = { description = "Choose an option", effect = "update" }
send = { description = "Send a message", effect = "insert" }
serve = { description = "Run a service until it's stopped", effect = "insert" }
service = { description = "Run the background service", effect = "insert" }
shared = { description = "Serve the shared folders of an agent's teams", effect = "insert" }
state-send = { description = "Send an agent's state to another machine", effect = "insert" }
status = { description = "Say how something is doing", effect = "find" }
steer = { description = "Steer the answer being written", effect = "update" }
transcribe = { description = "Turn speech into text", effect = "insert" }
type = { description = "Type text", effect = "update" }
unsandboxed = { description = "Run the agent's harness outside a sandbox", effect = "insert" }
usage = { description = "Show what has been used", effect = "find" }
verbose = { description = "Show or hide its tool calls", effect = "update" }
write = { description = "Write something", effect = "update" }

[actions."agent.agent.action-bridge"]
description = "Serve proved namespace actions outside agent sandboxes"
resource = "agent"
role = "plumbing"
output = "core.report"

[actions."agent.agent.action-bridge".args]
keys = { type = "string", description = "The binding verification keys", required = true }
runtime = { type = "string", description = "The machine runtime folder", required = true }
settings = { type = "string", description = "The machine settings folder", required = true }
socket = { type = "string", description = "The socket the proxy proves action calls on", required = true }

[actions."agent.agent.backup"]
description = """
Back up your agent to your clouds: its files and what it knows

`lnk storage push` of its files folder, with the harness's state (memory,
conversations, skills; not its keys) in it as
`Backups/<harness>.tar`, and its instructions, skills and
conversations, in its own folder, as `Backups/Agent.tar`. Your agent is stopped meanwhile so the copy is
whole.
"""
resource = "agent"
role = "plumbing"
output = "core.report"

[actions."agent.agent.backup".args]
yes = { x-link-cli = { shared = "yes" } }

[actions."agent.agent.bridge"]
description = """
For `lnk agent start`: carry the agent's connections for a harness that
speaks none (its background service)
"""
resource = "agent"
role = "plumbing"
output = "core.report"

[actions."agent.agent.bridges"]
description = """
For `lnk agent start`, where this machine's `shared_bridge` is on: one
bridge carrying every agent's connections and messages here, and one
scheduler runner a time zone, until none is left (its background service)
"""
resource = "agent"
role = "plumbing"
output = "core.report"

[actions."agent.agent.bridges".args]
dir = { type = "string", description = "Its folder, where each agent it carries is kept", required = true, x-link-path = true, x-link-cli = { position = 1 } }

[actions."agent.agent.connect"]
description = """
Connect your agent to Telegram, Slack, Discord or Signal

Sets up the connection, the harness's own or one Link carries for it, so
that only you can talk to your agent there. It stays when you switch
harness (on one that speaks it) or move your agent.
"""
resource = "agent"
role = "primary"
output = "core.report"
docs = "/agents/connections/connect#choose-an-app"
next = ["agent.agent.disconnect", "agent.agent.show", "agent.share.add", "agent.chat.start", "agent.agent.start"]
fail = ["agent.agent.show", "core.module.list", "agent.agent.start", "agent.harness.set"]

[actions."agent.agent.connect".args]
connection = { type = "string", description = "A connection: telegram reads the bot's token from LNK_TELEGRAM_TOKEN, slack its two tokens from LNK_SLACK_BOT_TOKEN and LNK_SLACK_APP_TOKEN, discord its bot's token from LNK_DISCORD_TOKEN, signal the agent's number and your own (`lnk agent connect signal` asks), or another connection module's", required = true, x-link-cli = { position = 1 } }
secret = { type = "string", format = "link-id", description = "The bot token's secret, by its ID, secret:<id>, which the connection's service is given to pass, on an agent a cloud hosts; here the connection reads its token as it says" }

[actions."agent.agent.context-mcp"]
description = "Serve the agent's public context over MCP"
resource = "agent"
role = "plumbing"
output = "core.mcp"

[actions."agent.agent.context-mcp".args]
agent-id = { type = "string", description = "The agent's ID", required = true }

[actions."agent.agent.create"]
description = """
Make another agent, and start it (--agent <name> then picks it)

It has its own settings, files, harness, bot and sandbox; the other
agents can't reach its folder. `--agent <name>` then acts on it. It is
made here, or with --on on a box of yours or a machine of your Local
Cloud, or with --cloud by a cloud that hosts agents (`link`).
"""
rest-args = ["name", "from"]
role = "primary"
output = "life-agent-entry"
spec = "agent"
docs = "/agents/start/create#create-on-a-hosting-account"
next = ["agent.agent.show", "agent.chat.start", "agent.agent.connect", "agent.log.show", "agent.agent.start", "agent.agent.stop", "agent.tool.list", "agent.agent.list", "agent.tool.add", "agent.harness.set", "agent.model.set"]
fail = ["agent.model.set", "model.runtime.add", "agent.agent.show", "core.module.list", "agent.agent.create", "agent.agent.start", "agent.log.show", "agent.spec.show", "agent.agent.stop"]

[actions."agent.agent.create".args]
agent = false
from = { type = "string", pattern = "^[a-z][a-z0-9-]*$", description = "An agent to start from, by the name of its archive, with its instructions, skills and settings: a cloud that hosts agents makes it from one it lists" }
workplace = { x-link-cli = { shared = "workplace" } }
foreground = { type = "boolean", description = "Run it in this terminal instead of in the background" }
let-sleep = { type = "boolean", description = "Let the machine sleep while it runs, this start alone: the next start keeps it awake again unless its specification's `[run] let_sleep` says otherwise" }
name = { type = "string", description = "Its name: lowercase letters, digits and dashes, starting with a letter; not here or all, which are Link's words", required = true, x-link-cli = { position = 1 } }
no-sandbox = { type = "boolean", description = "Run with no sandbox, from now on, until a start with --sandbox: the harness can then read your whole home folder (documents, SSH keys, browser data) and write outside its own. The only way to run without one, never implied by --yes. Available on a computer or box; refused where trusted machine policy forbids it (`unsandboxed = false` in agents.toml) or policy cannot be trusted", x-link-cli = { conflicts = ["sandbox"] } }
sandbox = { type = "string", description = "A sandbox file, a TOML file of what you grant the agent whichever harness runs it (`lnk agent show --permissions` shows it): kept with its settings, in place of what `lnk agent permission add` and `remove` wrote. It runs in its sandbox from now on; given alone, as `--sandbox own`, it only runs in its own sandbox again, after --no-sandbox", x-link-path = true, x-link-cli = { default-missing = "own" } }
spec = { type = "string", description = "A specification file, a TOML file of its opinions over Link's, its field flags laid over it (`lnk agent spec show` prints the whole): kept with its settings, read at every start", x-link-path = true }
yes = { x-link-cli = { shared = "yes" } }

[actions."agent.ready-made.list"]
description = """
List the ready-made agents a new agent may start from

Each by its name, which agent create's from takes, with its title and
what it does, from its archive. A cloud that hosts agents answers it,
with every ready-made agent it runs.
"""
role = "secondary"
surfaces = ["rest"]
keeps = { for = "1h", shared = true }

[actions."agent.ready-made.list".args]
agent = false

[actions."agent.agent.delete"]
description = """
Delete an agent here for good: its settings, harnesses and service, and
its files after asking

Its harnesses' installs, memory and conversations, its log, secrets and
sandbox rules, and its memory's and scheduler's tools go. Its buckets
stay in your clouds. Its files folder goes only when you say so
(--delete-files); kept, its settings and files are one archive,
~/Link/Archive/<name>-<date>.tar.gz, which lnk archive import brings back
as a new agent, and a folder you chose stays where it is.
"""
role = "secondary"
output = "core.report"
docs = "/agents/start/create#delete-an-agent"
next = ["agent.agent.list", "agent.agent.create"]
fail = ["agent.agent.show", "core.module.list", "agent.agent.delete", "agent.agent.stop"]

[actions."agent.agent.delete".args]
agent = false
delete-files = { type = "boolean", description = "Delete its files folder too, when it's its own" }
name = { type = "string", description = "An agent (`lnk agent list`)", required = true, x-link-cli = { position = 1 } }
yes = { x-link-cli = { shared = "yes" } }

[actions."agent.agent.deliver"]
description = """
For `lnk agent move`: messages a cloud that hosts agents held while the
agent was paused there, JSON lines on stdin, given to it as its connections' messages
"""
resource = "agent"
role = "plumbing"
output = "core.report"

[actions."agent.agent.disconnect"]
description = """
Disconnect your agent from a connection

Forgets the connection's tokens and restarts your agent if it's running.
A name no connection module has is refused; a connection that isn't
connected is said, and nothing changes. The bot or app itself stays yours: delete it with BotFather
(/deletebot), at api.slack.com/apps or at
discord.com/developers/applications; unlink Signal on the phone
(Linked Devices).
"""
resource = "agent"
role = "secondary"
output = "core.report"
docs = "/agents/connections/connect/security#you-and-your-shared-chats"
next = ["agent.agent.connect", "agent.agent.show"]
fail = ["agent.agent.show", "core.module.list", "agent.agent.start"]

[actions."agent.agent.disconnect".args]
connection = { type = "string", description = "A connection: telegram, slack, discord, signal, or another connection module's", required = true, x-link-cli = { position = 1 } }

[actions."agent.agent.left"]
description = """
For `lnk agent move`, on the machine an agent left: it answers on
machine `--on` (or cloud `--cloud`) now, so its settings, state and
secrets here go, its files are kept 30 days (or as agents.toml's
keep_moved says), and a note says where it went
"""
resource = "agent"
role = "plumbing"
output = "core.report"

[actions."agent.agent.left".args]
workplace = { x-link-cli = { shared = "workplace" } }
agent-id = { type = "string", description = "The agent's ID, which a move names it by: refused when the agent of this name has another" }
machine-id = { type = "string", description = "The machine's ID, so a machine renamed or made again under the name isn't taken for it" }
move = { type = "string", description = "The move's ID: refused while another move holds the agent here, and that move's hold let go of" }

[actions."agent.agent.list"]
description = """
List every agent, here and on each of your boxes

Each with its harness, whether it runs, the memory it uses, what its
model cost over the last day (with the measure module), and its files.
"""
rest-args = []
role = "primary"
output = "life-agents"
docs = "/agents/start/show#list-your-agents"
surfaces = ["cli", "rest", "tool"]
next = ["agent.agent.show", "agent.agent.create", "agent.agent.move", "agent.agent.delete", "agent.agent.start"]
fail = ["agent.agent.show", "core.module.list"]
route = { bridge = "command", callers = ["owner", "agent"], limits = { bytes = 1048576, time_ms = 30000 } }

[actions."agent.agent.list".args]
agent = false
here = { type = "boolean", description = "Only this machine's agents, without asking your boxes" }
json = { x-link-cli = { shared = "json" } }
refresh = { type = "boolean", description = "Ask your clouds for boxes made on your other computers too, not only\nthose this one knows" }

[actions."agent.log.show"]
description = """
Show your agent's log, or watch what it does as it does it

Each line shows its time on this machine's clock, a mark for a warning
or an error, and the IDs that place it, short: its conversation (`chat`),
turn and tool call. The same line written again in a row shows once,
with how many times (`×3`). `--json` prints every line's record, one
JSON object a line: `at` (RFC 3339, UTC), `level` (`info`, `warning` or
`error`), `agent`, `chat`, `turn` and `call` where it has them, and
`text`; a line its harness wrote outside Link's records as `{"text"}`.

`--live` prints a line a step, as it happens: a message come, the model
thinking (and, each minute it goes on, that it still is), a tool called
and answered or failed, the answer sent with how long it took, and the
agent stopping and starting. So a slow answer shows where it waits. It
reads Link Harness's conversations; with another harness, only the
starts and stops show.
"""
resource = "agent"
role = "secondary"
output = "life-log-line"
docs = "/agents/start/log#read-the-log"
next = ["agent.agent.show", "agent.agent.stop"]
fail = ["agent.agent.show", "core.module.list", "agent.agent.start"]

[actions."agent.log.show".args]
follow = { type = "boolean", description = "Keep printing new lines", x-link-cli = { short = "f", conflicts = ["live"] } }
json = { x-link-cli = { shared = "json" } }
live = { type = "boolean", description = "Print what your agent does as it does it, until Ctrl-C", x-link-cli = { conflicts = ["json"] } }

[actions."agent.agent.migrate"]
description = """
Bring an agent you already have under Link, keeping its harness: OpenClaw,
Hermes or DeepSeek, installed here outside Link

It says what it found and where each part goes before anything happens,
then each step as it ends: its home copied into the agent's and checked,
its secrets added to Link's, its own service stopped (never deleted).
The original keeps working. Stopped partway, running it again resumes;
`lnk agent delete <name>` clears it. --agent names the agent [default:
main, else the harness's name]
"""
resource = "agent"
role = "primary"
output = "core.report"
docs = "/agents#migrate-to-local-link"
next = ["agent.agent.show", "agent.chat.start", "agent.agent.start", "agent.agent.migrate", "agent.harness.set"]
fail = ["agent.agent.show", "core.module.list", "agent.agent.migrate", "agent.agent.delete"]

[actions."agent.agent.migrate".args]
clean = { type = "boolean", description = "Once your agent answers under Link: remove the original install, every\nfile of it named first" }
harness = { type = "string", description = "The harness to bring in, when more than one is installed: openclaw,\nhermes or deepseek" }
yes = { x-link-cli = { shared = "yes" } }

[actions."agent.agent.move"]
description = """
Move an agent to one of your boxes, a cloud, or back here

`lnk agent move aws` moves it to your box in the cloud aws,
starting one first (billed by the cloud) if you have none; `--on mybox`
to a box by its name. Its state, files, settings and phone come along,
and it runs there instead; once it answers there, the machine it left
deletes its copy (its files stay 30 days). Run it on this machine,
wherever the agent is: `lnk agent move here --agent work`. `lnk agent
move aws --image web-ready` starts a new box there from your
image first.

The agent is --agent (its name, or name@machine when two have it), else
the only one.
"""
resource = "agent"
role = "primary"
output = "core.report"
docs = "/agents/move#move-your-agent-to-the-cloud"
next = ["agent.agent.show", "agent.chat.start", "agent.agent.move", "agent.agent.connect", "agent.tool.add", "agent.tool.list", "agent.harness.set", "agent.model.set", "agent.agent.stop"]
fail = ["agent.agent.show", "core.module.list", "agent.agent.move"]

[actions."agent.agent.move".args]
workplace = { x-link-cli = { shared = "workplace" } }
image = { type = "string", description = "A new box in the cloud account TO, from one of your images there (`lnk\nbox image list`): the agent moves onto a box already set up" }
no-start = { type = "boolean", description = "Put the agent in place without starting it (tests)", x-link-cli = { hidden = true } }
yes = { x-link-cli = { shared = "yes" } }

[actions."agent.agent.needs"]
description = """
For `lnk agent move`, on the machine an agent came to: what its harness
needs beyond Link's defaults and hasn't been answered here, as JSON
{"harness", "needs": [[need, why]], "running": [agent]}, each need a
specification's flags (`--network.mode host`) or a risk's name
"""
resource = "agent"
role = "plumbing"
output = "core.report"

[actions."agent.agent.needs".args]
add = { type = "array", items = { type = "string" }, description = "A need its harness asks for now, as the JSON names it, which the\nmachine running the move asked about and was allowed: granted to the\nharness, answered" }

[actions."agent.agent.pause"]
description = """
For `lnk agent move`: the agent stops taking messages for its switch,
finishes the turn it's in, then stops
"""
resource = "agent"
role = "plumbing"
output = "core.report"

[actions."agent.agent.pause".args]
agent-id = { type = "string", description = "The agent's ID, which a move names it by: refused when the agent of this name has another" }
move = { type = "string", description = "The move's ID: the agent held here for that move alone, refused while another move holds it" }

[actions."agent.question.list"]
description = "Review owner questions, edit a draft or submit an exact response"
resource = "agent"
role = "primary"
output = "life-question-delivery"
docs = "/agents/more/interface/questions#list-and-answer-questions"
next = ["agent.question.list", "agent.agent.show"]
fail = ["agent.agent.show"]
checks = ["questions"]

[actions."agent.question.list".args]
code = { type = "string", description = "The question's response code", x-link-cli = { position = 1 } }
draft = { type = "string", description = "Save a complete draft from a JSON set submission without sending it", x-link-path = true, x-link-cli = { conflicts = ["submit"] } }
json = { x-link-cli = { shared = "json" } }
reply = { type = "string", description = "Submit this targeted text response", x-link-cli = { conflicts = ["draft", "submit"] } }
submit = { type = "integer", description = "Submit exactly this saved draft revision" }

[actions."agent.agent.receive"]
description = """
For `lnk agent move`: one phase of an agent's move from `lnk agent state-send`
on stdin, into staging here; a switch put in place (as the agent it is,
made if it isn't here) and started. A switch first says on stdout the key
it made for this one move, which its secrets are sealed to
"""
resource = "agent"
role = "plumbing"
output = "core.report"
checks = ["receive"]

[actions."agent.agent.receive".args]
agent-id = { type = "string", description = "The agent's ID: what --have prints, or the only agent a stream may be of" }
have = { type = "boolean", description = "Print what this machine holds of the agent, as JSON, and read nothing" }
no-start = { type = "boolean", description = "Put it in place without starting it" }
phase = { type = "string", description = "copy (into staging, printing what it holds) or switch (the default)" }

[actions."agent.agent.restart"]
description = "Stop your existing agent, then start it in the background with its saved settings"
resource = "agent"
role = "secondary"
output = "core.report"
docs = "/agents/start#stop-and-restart"
next = ["agent.agent.show", "agent.chat.start", "agent.log.show", "agent.agent.connect", "agent.tool.add", "agent.tool.list", "agent.harness.set", "agent.model.set", "agent.agent.stop"]
fail = ["agent.model.set", "model.runtime.add", "agent.agent.show", "agent.log.show", "agent.agent.start", "agent.spec.show", "agent.agent.stop"]

[actions."agent.agent.restore"]
description = """
Bring back an agent from its bucket, or what it knew from its backup

An agent here gets back what its harness knew at its last `lnk agent
backup` (memory, conversations, skills), replacing what it knows now;
its files, settings and secrets stay.

An agent whose machine is gone: finds its bucket in your cloud accounts
(`lnk cloud`) by its name, asks for the encryption password shown when
the bucket was made, and puts back its files and what it knew, as the
same agent. Its model credential and bot aren't in the bucket: asked again.
"""
resource = "agent"
role = "plumbing"
output = "core.report"
spec = "agent"
next = ["agent.agent.start", "agent.agent.show"]
fail = ["agent.agent.show", "core.module.list", "agent.agent.restore", "agent.agent.start"]

[actions."agent.agent.restore".args]
foreground = { type = "boolean", description = "Run it in this terminal instead of in the background" }
id = { type = "string", description = "Its ID, when buckets of two agents have that name" }
let-sleep = { type = "boolean", description = "Let the machine sleep while it runs, this start alone: the next start keeps it awake again unless its specification's `[run] let_sleep` says otherwise" }
name = { type = "string", description = "Its name [default: -a, else the only one here]", x-link-cli = { position = 1 } }
no-sandbox = { type = "boolean", description = "Run with no sandbox, from now on, until a start with --sandbox: the harness can then read your whole home folder (documents, SSH keys, browser data) and write outside its own. The only way to run without one, never implied by --yes. Available on a computer or box; refused where trusted machine policy forbids it (`unsandboxed = false` in agents.toml) or policy cannot be trusted", x-link-cli = { conflicts = ["sandbox"] } }
no-start = { type = "boolean", description = "Put it back without starting it (tests)", x-link-cli = { hidden = true } }
sandbox = { type = "string", description = "A sandbox file, a TOML file of what you grant the agent whichever harness runs it (`lnk agent show --permissions` shows it): kept with its settings, in place of what `lnk agent permission add` and `remove` wrote. It runs in its sandbox from now on; given alone, as `--sandbox own`, it only runs in its own sandbox again, after --no-sandbox", x-link-path = true, x-link-cli = { default-missing = "own" } }
spec = { type = "string", description = "A specification file, a TOML file of its opinions over Link's, its field flags laid over it (`lnk agent spec show` prints the whole): kept with its settings, read at every start", x-link-path = true }
yes = { x-link-cli = { shared = "yes" } }

[actions."agent.agent.resume"]
description = """
For `lnk agent move`: the agent takes messages again after a switch that
failed, and starts
"""
resource = "agent"
role = "plumbing"
output = "core.report"

