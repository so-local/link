# The agent module's shapes: its agent and team spec kinds, the outputs
# of its actions and the resources they're on.
schema = 1

[agent]
type = "object"
description = """
An agent, written down: the file `lnk agent start --spec` reads and
`lnk agent spec show` prints.
"""
x-link-spec = { kind = "agent" }
x-link-checks = ["agent"]
additionalProperties = false
properties.approvals = "interactions.interaction-opinions"
properties.isolation = "agent-isolation"
properties.extends = "agent-extends"
properties.harness = "agent-harness"
properties.model = "agent-model"
properties.window = "agent-window"
properties.turns = "agent-turns"
properties.instructions = "agent-instructions"
properties.commands = "agent-commands"
properties.goals = "agent-goals"
properties.tools = { shape = "agent-tool", examples = [{ answer = "32 KB", timeout = "30s", strangers = ["web__fetch"] }] }
properties.connections = "connection-policy.connection"
properties.storage = "store.storage"
properties.run = "agent-run"
properties.access = "agent-message-access"

[agent.properties.schedules]
type = "array"
description = "Schedule definitions owned by this agent, independent of its harness."
items = "agent-schedule"

[agent.properties.env]
type = "string"
description = "Environment input for future agent creation, relative to this file."
x-link-path = true
examples = ["env.toml"]

[agent.properties.name]
type = "string"
description = """
The agent's own name, no other: lowercase letters, digits and dashes. A
specification naming another agent is refused.
"""
examples = ["main"]

[agent.properties.version]
type = "integer"
maximum = 4294967295
description = """
A whole number of yours, to say which revision of the specification this
is; Link reads nothing from it.
"""
minimum = 0
examples = [3]

[agent.properties.command_response]
type = "string"
description = "Text shown before a command's harness answer; empty disables it."
examples = ["> "]

[agent.properties.tool]
type = "object"
description = "Each tool's own, by its name (`memory`)."
propertyNames = { type = "string", x-link-ref = "tool", description = "A tool's name, read as the name it has today" }
additionalProperties = "agent-tool"
examples = [{ memory = { keep = "30d", max_age = "1d", tokens = 4000, model = "local/qwen3:8b", notes = "4 KB" }, scheduler = { enabled = true, per_day = 20, subagents = 2, hops = 3, late = "skip", ask = true, recurring = "ask", zone = "Europe/London", interval = "10m", firing = "1m", driver = "service" }, web = { fetch = "24 KB", hosts = ["docs.rs", "*.wikipedia.org"] }, run = { output = "16 KB", background = 2, background_timeout = "1h", background_output = "16 MB", background_keep = "1d", background_per_day = 10 }, file = { find = true, diffs = true }, code = { servers = { rust = { command = ["rust-analyzer"], files = ["rs"], roots = ["Cargo.toml"] } } }, browser = { timeout = "1m", headless = true } }]

[agent.properties.connection]
type = "object"
description = "Each connection's own, by its module's name (`slack`)."
additionalProperties = "connection-policy.connection"
examples = [{ slack = { working = "eyes", stream = true, activity = "keep", activity_mark = "*", activity_separator = " - ", pace = "1s", steered = "wave", groups = "mention", images = true, documents = true, voice = true } }]

[agent-schedule]
type = "object"
description = """
A schedule the agent keeps: a message sent to it at a time, as if
from where it goes.
"""
required = ["name", "when", "message", "to", "enabled"]
additionalProperties = false
properties.when = "agent-state-protocol.when"
properties.to = "agent-state-protocol.destination"

[agent-schedule.properties.name]
type = "string"
description = """
Its name, unique among the agent's schedules, which its record
knows it by.
"""
examples = ["morning"]

[agent-schedule.properties.message]
type = "string"
description = "The message the agent is sent when it fires."
examples = ["Summarize what came in overnight."]

[agent-schedule.properties.enabled]
type = "boolean"
description = "Whether it fires; false keeps it, firing nothing."

[agent-isolation]
type = "object"
description = """
An agent specification's `[isolation]`: the VM a new agent is made in, its
only key a specification may set.
"""
additionalProperties = false

[agent-isolation.properties.vm]
type = "string"
description = """
The VM specification a new agent is made in, relative to this file. This
build has no VM provider, so a specification naming one is refused, never
run in a sandbox instead.
"""
x-link-path = true
x-link-unavailable = "this build of Link has no VM provider"

[agent-extends]
type = "string"
description = "What a specification starts from. `link`, link's specification, as when it's left out; `none`, nothing: every key is the file's own."
enum = ["link", "none"]

[agent-harness]
type = "object"
required = ["name"]
additionalProperties = false
# `--harness openclaw` is `--harness.name openclaw`.
x-link-shorthand = "name"

[agent-harness.properties.name]
type = "string"
description = """
The harness's name, as `lnk agent harness list` names it (`link`,
`openclaw`): lowercase letters, digits and dashes.
"""
examples = ["link"]

[agent-model]
type = "object"
description = "The model, and how it's asked."
additionalProperties = false
properties.thinking = "model.thinking"
properties.anthropic = "agent-provider-model"
properties.openai = "agent-provider-model"
properties.openrouter = "agent-provider-model"
properties.ollama = "agent-provider-model"
properties.local = "agent-provider-model"

[agent-model.properties.default]
type = "string"
description = """
The model when the agent names none.

In `[model]`, named with who serves it (`local/qwen3:8b`,
`anthropic/claude-opus-5-5`); in a provider's table, as that provider
names it. Link's specification sets `claude-haiku-5-5` on Anthropic, `gpt-6-luna`
on OpenAI and `anthropic/claude-haiku-5.5` on OpenRouter. `lnk agent
start --model.default <model>` selects it for the agent.
"""
examples = ["anthropic/claude-sonnet-5-5"]

[agent-model.properties.allow]
type = "array"
description = "The only models it may run; left out, any."
items = { type = "string" }
examples = [["anthropic/claude-sonnet-5-5"]]

[agent-model.properties.answer]
type = "integer"
maximum = 4294967295
description = """
The longest answer, in tokens, as you set it, at least 256; left out,
`[window] answer`'s share of the window, at most the model's own.
"""
minimum = 0
examples = [4096]

[agent-model.properties.thinking_budget]
type = "integer"
maximum = 4294967295
description = """
The most tokens it thinks, at least 1024, for a model that thinks within
a budget. Link's specification sets 2048.
"""
minimum = 0
examples = [2048]

[agent-model.properties.transcribe]
type = "string"
description = """
The model of its provider a voice note is heard with, its words the
message's (`[connections] voice`); left out, or `"none"`, a voice note
is left out, and the agent told so. Link's specification sets OpenAI's
`gpt-4o-mini-transcribe`.
"""
examples = ["gpt-4o-mini-transcribe"]

[agent-model.properties.fallback]
type = "boolean"
description = """
Whether a turn its model can't answer goes to the fallback model,
`fallback_model`: the model is off, the turn's prompt is past its
window, or its provider is busy (429, or a 5xx). False, it fails,
and the agent keeps no fallback.
"""

[agent-model.properties.fallback_model]
type = "string"
description = """
The hosted model used when falling back, named as `default` names
one (`anthropic/claude-sonnet-5-5`), or one of `aliases`. Its
credential is its provider's, or `LNK_FALLBACK_CREDENTIAL`'s. Link
Harness falls back; a harness that can't says so.
"""
examples = ["anthropic/claude-haiku-5-5"]

[agent-model.properties.aliases]
type = "object"
description = """
Names for models, each a word for a model as its provider names it
(`high = "claude-opus-5-5"`): `/model:set high`, a subagent started on
`high` and a fallback of `high` each run that model. Only `[model]`
takes the table, never a provider's, and Link's specification has none.
"""
additionalProperties = { type = "string" }

[agent-provider-model]
type = "object"
description = """
A provider's table of `[model]`: the keys that differ by provider,
each replacing `[model]`'s for an agent thinking with one of its
models. It holds no tables of its own.
"""
additionalProperties = false
properties.thinking = "model.thinking"

[agent-provider-model.properties.default]
type = "string"
description = """
The model when the agent names none, as this provider names it
(`claude-sonnet-5-5`).
"""
examples = ["claude-sonnet-5-5"]

[agent-provider-model.properties.allow]
type = "array"
description = "The only models of this provider it may run; left out, `[model]`'s."
items = { type = "string" }
examples = [["claude-sonnet-5-5"]]

[agent-provider-model.properties.answer]
type = "integer"
maximum = 4294967295
description = "The longest answer, in tokens, at least 256."
minimum = 0
examples = [4096]

[agent-provider-model.properties.thinking_budget]
type = "integer"
maximum = 4294967295
description = """
The most tokens it thinks, at least 1024, for a model that thinks
within a budget.
"""
minimum = 0
examples = [2048]

[agent-provider-model.properties.transcribe]
type = "string"
description = """
The model of this provider a voice note is heard with; `"none"`,
none.
"""
examples = ["none"]

[agent-window]
type = "object"
description = "How much of the model's window a turn fills."
additionalProperties = false
properties.compact_at = "agent-compact-at"

[agent-window.properties.max]
type = "integer"
maximum = 4294967295
description = """
The window a turn fills, in tokens, at least 1024: yours or a team's as
set, Link's held to the model's own window; left out, the model's whole
window. Link's specification sets 128000.
"""
minimum = 0
examples = [128000]

[agent-window.properties.unknown]
type = "integer"
maximum = 4294967295
description = """
The window of a model Link doesn't know, in tokens, at least 1024.
Link's specification sets 32768.
"""
minimum = 0
examples = [32768]

[agent-window.properties.margin]
type = "number"
description = """
The share of the window kept back, from 0 to under 0.5: tokens are
counted roughly before a turn, exactly by the provider after (`0.125`,
an eighth). Link's specification sets 0.125.
"""
examples = [0.125]

[agent-window.properties.answer]
type = "number"
description = """
The share of the window kept for the answer, over 0 and under 1 and
under 1 with `margin`, at most the model's longest, where `[model]
answer` doesn't say. Link's specification sets 0.25.
"""
examples = [0.25]

[agent-window.properties.save_notes]
type = "boolean"
description = """
Whether, before it compacts, the model is asked to save what matters to
its notes, where it has a tool to (`memory__remember`), in a
conversation you spoke in, never one of others' messages alone. Link's
specification sets true.
"""

[agent-window.properties.past_price_jump]
type = "boolean"
description = """
Whether a turn fills the window past its model's first price jump, where
a long prompt costs more (the model's facts' `above`, as `lnk model
show` prints them).

False fills the window only up to that size, `max` included, so the
conversation compacts within it; true fills the whole window, each call
past the jump at its higher price. Link's specification sets false.
"""

[agent-compact-at]
description = "When a conversation is compacted (`[window] compact_at`): once it fills this share of what the window holds of it, or `never`."
examples = [0.8, "never"]
oneOf = [{ type = "number", description = "Once it fills this share of what the window holds of it" }, { const = "never", description = "Never" }]

[agent-turns]
type = "object"
description = "How long a turn may go on."
additionalProperties = false
properties.busy = "harness-wire.busy"

[agent-turns.properties.rounds]
type = "integer"
maximum = 4294967295
description = "The most rounds of calls in one turn, from 1. Link's specification sets 8."
minimum = 0
examples = [8]

[agent-turns.properties.calls]
type = "integer"
maximum = 4294967295
description = "The most calls one answer makes, from 1. Link's specification sets 16."
minimum = 0
examples = [16]

[agent-turns.properties.renew]
type = "string"
description = """
How often a running turn renews its lease, at least `"1s"`. Link's specification
sets `"10s"`.
"""
format = "duration"
examples = ["10s"]

[agent-turns.properties.lapse]
type = "string"
description = """
How long a lease not renewed lasts before its turn is taken for crashed
and finished, more than twice `renew`. Link's specification sets `"60s"`.
"""
format = "duration"
examples = ["60s"]

[agent-instructions]
type = "object"
description = """
What it's told to be: one file, nothing, or Link's sections. With
Link's assembly, where each section of its prompt comes from,
and how large each may be. A section's source is `link` (Link's own),
`none`, or a file in the agent's files folder (`instructions/base.md`).
The model's and the tools' have no source: its file in
`instructions/models/` and what each tool says of itself, so only
their most is set. The repository's is `link` (its `AGENTS.md` files)
or `none`.
"""
additionalProperties = false
properties.max = "agent-sections-max"

[agent-instructions.properties.source]
type = "string"
description = """
The whole prompt's source: `"link"`, as left out, assembles the sections
below; a Markdown file in the agent's files
(`"instructions/instruction.md"`) supplies the whole system prompt, read
again each turn without headings, templates, model overrides or message
times; `"none"` supplies none.

A file is read up to 64 KB, its outer whitespace trimmed; a missing,
empty or linked one supplies nothing. Section sources and sizes hold
only with `"link"`, and with `extends = "none"` a file or `"none"` needs
no section keys. Only a harness whose contract takes instructions, as
Link Harness does, takes the table: a start refuses it for any other.
"""
examples = ["link"]

[agent-instructions.properties.base]
type = "string"
description = """
The prompt's first section, what any agent of yours is: `link` (Link's,
a personal agent who answers briefly), `none`, or a file in its files
(`instructions/base.md`). Link's specification sets `"link"`.
"""
examples = ["link"]

[agent-instructions.properties.environment]
type = "string"
description = """
The fourth section, what it runs with here as Link resolved it at its
start: where its files are, which folders it may change, its
connections; `link`, `none` or a file. Link's specification sets `"link"`.
"""
examples = ["link"]

[agent-instructions.properties.skills]
type = "string"
description = """
The fifth section, each skill's name and what it's for, from
`skills/<name>/SKILL.md` in its files, sorted by name; `link`, `none` or
a file. Link's specification sets `"link"`.
"""
examples = ["link"]

[agent-instructions.properties.persona]
type = "string"
description = """
The sixth section, who it is apart from any task (its name, its voice,
its character): a file of yours in its files, read at each message, or
`none`. Link's specification sets `"instructions/persona.md"`.
"""
examples = ["instructions/persona.md"]

[agent-instructions.properties.owner]
type = "string"
description = """
The seventh section, who you are (your name, your work, the people in
your life, how you like things): a file of yours in its files, read at
each message, or `none`. Link's specification sets `"instructions/owner.md"`.
"""
examples = ["instructions/owner.md"]

[agent-instructions.properties.standing]
type = "string"
description = """
The eighth section, your standing instructions: a file in its files it
may edit, read at each message, or `none`. Link's specification sets
`"instructions/instruction.md"`.
"""
examples = ["instructions/instruction.md"]

[agent-instructions.properties.now]
type = "string"
description = """
The date, the time here, the connection and who's speaking, at the head
of each message, never in the system prompt: `link` or `none`. Link's
specification sets `"link"`.
"""
examples = ["link"]

[agent-instructions.properties.notes]
type = "string"
description = """
The ninth section, what the agent noted for itself, the file its
memory's `remember` writes, read at each message, or `none`. Link's specification
sets `"memory/notes.md"`; the old `instructions/notes.md` reads as it.
"""
examples = ["memory/notes.md"]

[agent-instructions.properties.repository]
type = "string"
description = """
What the repository it works in says of itself: `link` (its `AGENTS.md`,
else `CLAUDE.md`, nearest folder first) or `none`. A feature's switch,
off when left out.
"""
examples = ["link"]

[agent-sections-max]
type = "object"
description = "Each section's most ([`Instructions::max`])."
additionalProperties = false

[agent-sections-max.properties.base]
type = "string"
description = "The base section: its most (`\"16 KB\"`), past which it's cut."
examples = ["16 KB"]

[agent-sections-max.properties.model]
type = "string"
description = """
The model's own section, the second, from
`instructions/models/<maker>/<model>/instruction.md` in its files: its
most, past which it's cut. It has no source key.
"""
examples = ["16 KB"]

[agent-sections-max.properties.tools]
type = "string"
description = """
The tools' section, the third, what each tool says of itself: its most,
past which tools are cut whole. It has no source key.
"""
examples = ["16 KB"]

[agent-sections-max.properties.environment]
type = "string"
description = "What it runs with here: its most (`\"16 KB\"`), past which it's cut."
examples = ["16 KB"]

[agent-sections-max.properties.repository]
type = "string"
description = """
What the repository it works in says of itself: its most (`"16 KB"`),
past which it's cut.
"""
examples = ["16 KB"]

[agent-sections-max.properties.skills]
type = "string"
description = "Its skills: its most (`\"16 KB\"`), past which it's cut."
examples = ["16 KB"]

[agent-sections-max.properties.persona]
type = "string"
description = "Who it is: its most (`\"16 KB\"`), past which it's cut."
examples = ["16 KB"]

[agent-sections-max.properties.owner]
type = "string"
description = "Who its owner is: its most (`\"16 KB\"`), past which it's cut."
examples = ["16 KB"]

[agent-sections-max.properties.standing]
type = "string"
description = """
What its owner tells it to be: its most (`"16 KB"`), past which it's
cut.
"""
examples = ["16 KB"]

[agent-sections-max.properties.now]
type = "string"
description = """
The date, connection and speaker at the head of each message: its most
(`"16 KB"`), past which it's cut.
"""
examples = ["16 KB"]

[agent-sections-max.properties.notes]
type = "string"
description = """
What the agent noted for itself: its most (`"16 KB"`), past which it's
cut.
"""
examples = ["16 KB"]

[agent-commands]
type = "object"
description = """
Its commands: a message of its owner's that names one (`/new`) runs
it in place of a turn. Each is on when it's true here; left out, off.
"""
additionalProperties = false
properties.help = { description = "`/help`: the commands that are on.", type = "boolean" }
properties.stop = { description = "`/stop`: the answer being written stopped.", type = "boolean" }
properties.rename = { description = "`/chat:rename`: this conversation's name.", type = "boolean" }

[agent-commands.properties.status]
type = "boolean"
description = "`/status`: the model and what the conversation holds."

[agent-commands.properties.create]
type = "boolean"
description = "`/new`: a new conversation in the same chat."

[agent-commands.properties.model]
type = "boolean"
description = "`/model`: the model, or a switch to another of its provider's."

[agent-commands.properties.models]
type = "boolean"
description = "`/models`: the models offered by its provider."

[agent-commands.properties.tasks]
type = "boolean"
description = "`/tasks` and `/ps`: its running and scheduled work."

[agent-commands.properties.write]
type = "boolean"
description = """
`/learn`: a skill written from what it just did, where it may
write `skills/` with its file tool.
"""

[agent-commands.properties.goal]
type = "boolean"
description = """
`/goal`: a goal it pursues after each answer until it holds,
within `[goals]`' limits.
"""

[agent-commands.properties.resume]
type = "boolean"
description = "`/chat:resume`: the chat's conversations, or one taken up again."

[agent-commands.properties.fork]
type = "boolean"
description = "`/chat:fork`: a conversation holding this one as it stands."

[agent-commands.properties.export]
type = "boolean"
description = "`/chat:export`: this conversation written to a file."

[agent-commands.properties.queue]
type = "boolean"
description = "`/chat:queue`: the next message waits for the running turn."

[agent-commands.properties.steer]
type = "boolean"
description = """
`/chat:steer`: the next message joins the running turn, where
`[turns] busy` steers.
"""

[agent-commands.properties.compact]
type = "boolean"
description = "`/chat:compact`: what's before the last message summarized now."

[agent-commands.properties.ask]
type = "boolean"
description = "`/chat:ask`: a question answered apart, nothing kept."

[agent-commands.properties.skills]
type = "boolean"
description = "`/skill:list`, and each skill run as `/skill:<name>`."

[agent-commands.properties.verbose]
type = "boolean"
description = "`/chat:verbose`: whether the chat shows each tool call."

[agent-goals]
type = "object"
description = """
How long a goal is pursued, turn after turn, before it's left:
whichever is reached first.
"""
additionalProperties = false

[agent-goals.properties.turns]
type = "integer"
maximum = 4294967295
description = """
The most turns it takes on its own toward a goal, after the one that set
it, from 1 to 1000. Link's specification sets 10.
"""
minimum = 0
examples = [10]

[agent-goals.properties.tokens]
type = "integer"
description = """
The most tokens those turns spend, its prompts' and answers', at least
1000: Link's specification sets 1000000.
"""
minimum = 0
examples = [1000000]

[agent-tool]
type = "object"
description = """
A tool's opinions (`[tools]` for every tool, `[tool.<name>]` for one).
Link's tools' keys are typed; a tool from outside Link may have keys
of its own ([`Tool::other`]).
"""
additionalProperties = { x-link-any = true, description = "A key of a tool from outside Link, its own to read: Link keeps it and doesn't read it" }
examples = [{ enabled = false }, { answer = "8 KB", timeout = "30s", keep = "30d", max_age = "1d", tokens = 4000, model = "local/qwen3:8b", notes = "4 KB", per_day = 20, subagents = 2, hops = 3, late = "skip", ask = true, recurring = "ask", zone = "Europe/London", interval = "10m", firing = "1m", enabled = true, driver = "service", fetch = "24 KB", output = "16 KB", background = 2, background_timeout = "1h", background_output = "16 MB", background_keep = "1d", background_per_day = 10, find = true, diffs = true, servers = { rust = { command = ["rust-analyzer"], files = ["rs"], roots = ["Cargo.toml"] } }, strangers = ["web__fetch"] }]
properties.late = "agent-late"
properties.driver = "agent-scheduler-driver"
properties.recurring = "agent-scheduler-recurring"

[agent-tool.properties.answer]
type = "string"
description = """
What's kept of a tool's answer, 1 KB to 16 MB; in `[tool.<name>]`, one
tool's. Link's specification sets `"32 KB"`.
"""

[agent-tool.properties.timeout]
type = "string"
description = """
How long a tool's call may take, at least a second; past it the model is
told it didn't answer. In `[tool.<name>]`, one tool's: the run tool
stops a command a tenth before it (2 s at least, half at most), with
all it started, so what it printed comes back. Waiting for you to allow a call isn't counted: a
tool not Link's own has `[connections] ask_wait` beside it. Link's specification
sets `"5m"`, and the run tool's `"2m"`.
"""
format = "duration"
examples = ["5m"]

[agent-tool.properties.keep]
type = "string"
description = """
Memory's: how long its session stays once no turn uses it. Link's specification
sets `"10m"`.
"""
format = "duration"
examples = ["10m"]

[agent-tool.properties.max_age]
type = "string"
description = "Memory's: how long its session lives at most. Link's specification sets `\"1h\"`."
format = "duration"
examples = ["1h"]

[agent-tool.properties.tokens]
type = "integer"
maximum = 4294967295
description = """
Memory's: the most tokens a search or a read gives, at least 100 and at
most 6000, the most one answer holds. Link's specification sets 6000.
"""
minimum = 0

[agent-tool.properties.model]
type = "string"
description = """
Memory's: the embedding model it ranks by; `none`, by words only, no
model started. Link's specification sets `qwen3-embedding`.
"""

[agent-tool.properties.notes]
type = "string"
description = """
Memory's: how large the agent's notes may grow, 64 B to 64 KB, past
which `remember` refuses to write. Link's specification sets `"4 KB"`.
"""

[agent-tool.properties.dimensions]
type = "integer"
minimum = 1
maximum = 65535
description = """
Memory's: how many of the embedding model's dimensions are kept: fewer
cost less memory and disk, more rank a little better. Link's
specification sets 256.
"""

[agent-tool.properties.memory]
type = "string"
description = """
Memory's: the most its service holds of its own for this agent's index,
besides the pages of files it maps. Link's specification sets
`"512 MB"`.
"""
examples = ["512 MB"]

[agent-tool.properties.reserve]
type = "string"
description = """
Memory's: the disk left free; below it indexing pauses, calls go on
answering, and it resumes once there's room. Link's specification sets
`"1 GB"`.
"""
examples = ["1 GB"]

[agent-tool.properties.file]
type = "string"
description = """
Memory's: the largest file in its folders it indexes; a larger one is
left out, and a search's reply names it. Link's specification sets
`"16 MB"`.
"""
examples = ["16 MB"]

[agent-tool.properties.threads]
type = "integer"
minimum = 1
maximum = 1024
description = """
Memory's: the threads indexing takes, so a laptop isn't
taken over. Link's specification sets 1.
"""

[agent-tool.properties.deadline]
type = "string"
description = """
Memory's: how long a search ranks before it answers with what it has.
Link's specification sets `"300ms"`.
"""
format = "duration"
examples = ["300ms"]

[agent-tool.properties.folders]
type = "array"
description = """
Memory's: the agent's folders it indexes, `memory` (its Home's) and
`chats` (its conversations). Link's specification sets both.
"""
items = { type = "string", enum = ["memory", "chats"] }
examples = [["memory", "chats"]]

[agent-tool.properties.kept_off]
type = "string"
description = """
Memory's: the largest index kept off the machine, fetched at each wake
where the machine runs agents only while they answer. Link's
specification sets `"2 GB"`.
"""
examples = ["2 GB"]

[agent-tool.properties.per_day]
type = "integer"
maximum = 4294967295
description = """
The scheduler's: messages its schedules send the agent a day, the day
in its `zone`, from 1; subagents' work is outside it. It bounds how many
messages agents send each other, and caps what the agent takes from each
teammate a day (UTC). Link's specification sets 100.
"""
minimum = 0

[agent-tool.properties.subagents]
type = "integer"
maximum = 4294967295
description = "The scheduler's: subagents at work at once, from 1. Link's specification sets 5."
minimum = 0

[agent-tool.properties.hops]
type = "integer"
maximum = 4294967295
description = """
The scheduler's: how deep a chain of messages goes, each sent by an
agent on its own, from 1: a depth and not a count, as a recurring job's
firings start again. Link's specification sets 8.
"""
minimum = 0

[agent-tool.properties.ask]
type = "boolean"
description = """
The scheduler's: whether every call but those that only read asks you
first. A recurring schedule asks you either way, unless its call says
once or `recurring` is `allow`. Link's specification sets false.
"""

[agent-tool.properties.zone]
type = "string"
description = """
The scheduler's: the time zone its times are in, `local` (this
machine's) or a zone's name (`Europe/Paris`). Link's specification sets `local`.
"""

[agent-tool.properties.interval]
type = "string"
description = """
The scheduler's: the shortest a recurring schedule may repeat, 1m to 1d;
a model's `cron` that fires more often is refused when it's made. Link's
specification sets `"5m"`.
"""
format = "duration"
examples = ["5m"]

[agent-tool.properties.firing]
type = "string"
description = """
The scheduler's: how long it waits on a firing, a subagent's whole work,
before it gives up on it, 1s to 1d. Link's specification sets `"30m"`.
"""
format = "duration"
examples = ["30m"]

[agent-tool.properties.enabled]
type = "boolean"
description = """
Whether Link starts the tool for the agent, in `[tool.scheduler]`,
`[tool.run]`, `[tool.file]`, `[tool.code]` and `[tool.mcp]`; false
withholds it. Link's specification starts every tool disabled: the file tool, the
scheduler, run, code and Link MCP. Without the scheduler, no subagents or
schedules run. `[tool.browser]` and `[tool.desktop]` take it too: true
gives the screen at a start where this machine runs it, false takes it
away, and Link's specification says neither, leaving what `lnk agent tool add`
gave.
"""

[agent-tool.properties.fetch]
type = "string"
description = """
Web's: the most of a page one fetch gives, 1 KB to 1 MB; each part says
where the next starts. Link's specification sets `"24 KB"`.
"""

[agent-tool.properties.hosts]
type = "array"
description = """
Web's: the only hosts it fetches, as `[internet] hosts` names them: a
name (`docs.rs`), `*.` and a name for every name under it, or an
address; each redirect is held to them too. Left out, it fetches any
public host, as Link's specification leaves it. Link Harness sends it with each
call.
"""
items = { type = "string" }
examples = [["docs.rs", "*.wikipedia.org"]]

[agent-tool.properties.program]
type = "string"
description = """
The browser's: the Chromium-family program it starts, by its absolute
path, in place of the one it finds on this machine. It's an executable
program, never a launcher script (a file starting with `#!`), which
would run inside the browser's sandbox and be refused the programs it
calls; each start checks it, and refuses one that isn't. Left out, the
browser finds one, as Link's specification leaves it.
"""
examples = ["/opt/chromium/chrome"]

[agent-tool.properties.output]
type = "string"
description = """
Run's: what's kept of each of a command's output and its errors, its
start and its end, 1 KB to 16 MB. Link's specification sets `"16 KB"`.
"""

[agent-tool.properties.background]
type = "integer"
maximum = 4294967295
description = """
Run's: the most background commands at once, 0 to 64; 0, none. Link's
specification sets 4.
"""
minimum = 0

[agent-tool.properties.background_timeout]
type = "string"
description = """
Run's: the longest a background command runs before it's stopped, 1s to
7d. Link's specification sets `"1h"`.
"""
format = "duration"
examples = ["1h"]

[agent-tool.properties.background_output]
type = "string"
description = """
Run's: what's kept on disk of a background command's output, its end, 1
KB to 1 GB. Link's specification sets `"16 MB"`.
"""

[agent-tool.properties.background_keep]
type = "string"
description = """
Run's: how long a background command's record and output stay once it
ended and the agent was told, 1m to 365d. Link's specification sets `"1d"`.
"""
format = "duration"
examples = ["1d"]

[agent-tool.properties.background_per_day]
type = "integer"
maximum = 4294967295
description = """
Run's: the most background commands started in a day, each of whose
endings starts a turn, 1 to 65535. Link's specification sets 100.
"""
minimum = 0

[agent-tool.properties.find]
type = "boolean"
description = """
File's: whether it finds files by name and lines by a pattern (`find`).
A feature's switch, off when left out.
"""

[agent-tool.properties.diffs]
type = "boolean"
description = """
File's: whether `write` and `replace` answer with the change as a diff.
A feature's switch, off when left out.
"""

[agent-tool.properties.servers]
type = "object"
description = """
Code's: the language servers it may start, by the language each
serves (`rust`).
"""
additionalProperties = "agent-code-server"

[agent-tool.properties.strangers]
type = "array"
description = """
`[tools]` only: the tools a stranger's message may use, by the
names the harness offers them (`web__fetch`), its conversation
given these or fewer ([`crate::access::Standing::Stranger`]). Left
out, none.
"""
items = { type = "string" }

[agent-late]
type = "string"
description = "What a firing missed while the machine slept does. `run`, it fires once, on waking; `skip`, it doesn't; a recurring one fires at its next time."
enum = ["run", "skip"]

[agent-scheduler-recurring]
type = "string"
description = """
The scheduler's: whether a recurring schedule the agent makes asks you
first. `ask`, it waits for you to allow it unless its call says once;
`allow`, it starts without asking, as a one-off reminder does, though
`ask = true` still asks first of every call that writes. Link's specification
sets `ask`.
"""
enum = ["ask", "allow"]

[agent-scheduler-driver]
type = "string"
description = """
What wakes the scheduler's runner. `service`, the agent's bridge, a background service, runs it for good; `cron`, the machine's calendar (launchd on a mac, cron elsewhere) starts
it once a minute; nothing of it runs between; `address`, a machine that runs the agent only while it answers: the
scheduler tells it, at the address the machine gives, when the
agent's jobs are next due, and whatever wakes the agent then runs
it once; nothing of it runs between.
"""
enum = ["service", "cron", "address"]

[agent-code-server]
type = "object"
description = """
A language server of code's (`[tool.code.servers.<language>]`). Each
key is its own in a specification's union, so a specification may change one alone: a
key left out is the specification before's.
"""
additionalProperties = false

[agent-code-server.properties.command]
type = "array"
description = """
The program and its arguments, as `run` would start them; empty,
no server for the language.
"""
items = { type = "string" }

[agent-code-server.properties.files]
type = "array"
description = "The files it serves, by their extension (`rs`)."
items = { type = "string" }

[agent-code-server.properties.roots]
type = "array"
description = """
The files that mark a project's root (`Cargo.toml`): the nearest
folder above a file that holds one is the root its server is
started in; none found, the files folder.
"""
items = { type = "string" }

[agent-code-server.properties.settings]
type = "object"
description = """
The server's settings, by the section it asks for
(`rust-analyzer`): given whole when it asks for its configuration,
and told once it starts. Left out, it has its own defaults.
"""
additionalProperties = { x-link-any = true, description = "A section of the server's settings, as the server reads it" }

[agent-run]
type = "object"
description = "How an agent runs on its machine (`[run]`)."
additionalProperties = false

[agent-run.properties.files]
type = "string"
description = """
The agent's workspace folder. A relative path is from the folder the
start runs in; left out, it keeps the workspace it has. `lnk agent start
--run.files <dir>` sets it.
"""
x-link-path = true
examples = ["/home/me/work"]

[agent-run.properties.let_sleep]
type = "boolean"
description = """
Whether the machine may sleep while this agent runs: left out or false,
the agent keeps it awake; true, the machine's own sleep policy applies.
"""

[agent-run.properties.idle_after]
type = "string"
description = """
How long it goes with no message, no turn and no background command
before it stops, holding no process, memory or port, started again by
its next message: at least `"1s"`, or `"never"`, memory kept against a
start from cold. Link's specification sets `"5m"`.

It holds only where the machine's `shared_bridge` is on
(`~/.lnk/safe/agents/policy.toml`), since the
bridge then listens for it, and for an agent whose harness speaks none
of its connections itself.
"""
examples = ["5m"]

[agent-message-access]
type = "object"
description = """
An agent specification's `[access]`: who besides its owner may message it.
It takes chats alone, so a team's `member` isn't one of its keys.
"""
additionalProperties = false

[agent-message-access.properties.message]
type = "array"
description = """
Who may message the agent, besides its owner: chats on its
connections, whoever is in them, each `chat:<connection>:<chat
id>` (`chat:slack:C0TEAM`).
"""
items = "agent-chat"

[agent-chat]
type = "string"
description = """
A chat on a connection, whoever is in it, `chat:<connection>:<id>`:
a group the connection keeps, which a specification lets message its agent,
never a principal. Its id is the connection's own (Slack's `C0TEAM`,
Telegram's `-1001234`).
"""
examples = ["chat:slack:C0TEAM"]

[team]
type = "object"
description = """
A team's file: its head (`[access]` among it), its roster and its
shared settings, the opinions
every member shares in `[settings.agent]`.
"""
x-link-spec = { kind = "team" }
x-link-checks = ["team"]
x-link-resource = { id = "name" }
required = ["name"]
additionalProperties = false
properties.files = "team-files"
properties.access = "team-access"
properties.settings = { shape = "team-settings", default = {}, examples = [{ agent = { window = { compact_at = 0.75 } }, memory = { semantic = true, daily_credits = 100, indexer = { kind = "auto" }, payer = { kind = "owner" } } }] }

[team.properties.id]
type = "string"
description = """
The team's permanent ID, which keeps it the same team through
renames, restarts and moves; left out, the first apply assigns it.
"""
examples = ["k3m4n5p6q7r8"]

[team.properties.name]
type = "string"
description = "The team's name: lowercase letters, digits and dashes."
examples = ["research"]

[team.properties.version]
type = "integer"
maximum = 4294967295
description = """
A whole number of yours, to say which revision of the file this
is; Link reads nothing from it.
"""
minimum = 0

[team.properties.member]
type = "object"
description = """
Its members, by their names in the team: each an existing agent by
its ID, or an agent definition the team makes and manages.
"""
additionalProperties = "team-member"
examples = [{ scout = { purpose = "Finds sources", agent = { model = { thinking = "medium" } } }, reviewer = { id = "k3m4n5p6q7r8", service = "service:k3m4n5p6q7r8", owner = "a1b2c3d4", purpose = "Reviews drafts", write = ["drafts"], read = ["sources"] } }]

[team.properties.lead]
type = "string"
description = """
The member a message addressed to the team reaches, by its name;
left out, the team takes none until you name one.
"""
examples = ["scout"]

[team-member]
type = "object"
description = "A team's member, by its name in the file."
additionalProperties = false
properties.id = { description = "The agent's ID.", type = "string", examples = ["a1b2c3d4e5f6"] }
properties.agent = "agent"

[team-member.properties.service]
type = "string"
format = "link-id"
x-link-kind = "service"
description = """
The service the agent acts as, written service:<id>: the role holder
a teammate's check names. An own agent's is read from its settings
as the team is loaded; another account's is named in the file.
"""

[team-member.properties.purpose]
type = "string"
description = "What it's for on the team, for people and its teammates."

[team-member.properties.owner]
type = "string"
description = """
Its account, for another account's agent, which the team's
`[access] member` names: none, the team owner's own.
"""

[team-member.properties.write]
type = "array"
description = """
For another account's agent, the folders of the team's folder it
may write, and those it may only read, as `[teams.<team>]`
names them: the most it reaches, the team owner's to say. An own
agent's are in its sandbox file.
"""
items = { type = "string" }

[team-member.properties.read]
type = "array"
description = """
For another account's agent, the folders of the team's folder it
may only read.
"""
items = { type = "string" }

[team-files]
type = "object"
description = "`[files]`: the folder the team's members share."
required = ["shared"]
additionalProperties = false

[team-files.properties.shared]
type = "string"
description = "The shared folder, from the home folder (`~/Link/Teams/research`)."
examples = ["~/Link/Teams/research"]

[team-access]
type = "object"
description = """
A team file's `[access]`: which agents of other accounts may be on
it. It takes members alone, so an agent's `message` isn't one of its
keys.
"""
additionalProperties = false

[team-access.properties.member]
type = "array"
description = """
Which agents of other accounts may be on the team, each the
service it acts as, `service:<agent id>`: the team owner's yes; the
agent's owner says the other, by joining.
"""
items = { type = "string", examples = ["service:k3m4n5p6q7r8"] }

[team-settings]
type = "object"
additionalProperties = false
properties.agent = { shape = "agent", default = {} }
properties.memory = { shape = "team-memory", default = {} }

[team-memory]
type = "object"
description = "A team's memory: one memory over its shared folder, handed to the members granted all of it"
additionalProperties = false
properties.indexer = { shape = "team-indexer", default = { kind = "auto" } }
properties.payer = { shape = "team-payer", default = { kind = "owner" } }

[team-memory.properties.enabled]
type = "boolean"
description = """
Whether the team has a memory over its shared folder, handed to the
members granted all of it: off until the owner turns it on (`lnk agent
team-memory start`).
"""
default = false

[team-memory.properties.semantic]
type = "boolean"
description = "Non-indexers use words until the owner enables semantic queries."
default = false

[team-memory.properties.daily_credits]
type = "integer"
description = """
Shared daily memory spending in credits; required when enabling
semantic search. All callers debit the same team budget.
"""
minimum = 0

[team-indexer]
oneOf = ["team-indexer-auto", "team-indexer-member"]
examples = [{ kind = "auto" }, { kind = "member", member = "scout" }]

[team-indexer-auto]
type = "object"
description = "One eligible whole-folder writer, elected outside the runtime."
required = ["kind"]
additionalProperties = false

[team-indexer-auto.properties.kind]
type = "string"
description = "Which keeper it is: auto, elected, or a named member."
const = "auto"

[team-indexer-member]
type = "object"
description = "The selected member; names resolve to permanent IDs at delivery."
required = ["kind", "member"]
additionalProperties = false
properties.member = { description = "The member, by its name in the team's file.", type = "string" }

[team-indexer-member.properties.kind]
type = "string"
description = "Which keeper it is: auto, elected, or a named member."
const = "member"

[team-payer]
oneOf = ["team-payer-owner", "team-payer-member"]
examples = [{ kind = "owner" }, { kind = "member", member = "scout" }]

[team-payer-owner]
type = "object"
description = "The team's owner."
required = ["kind"]
additionalProperties = false

[team-payer-owner.properties.kind]
type = "string"
description = "Who pays: the team's owner, or a named member."
const = "owner"

[team-payer-member]
type = "object"
description = """
The account of this accepted member, with its explicit spending
authority; naming it in a specification alone grants no billing consent.
"""
required = ["kind", "member"]
additionalProperties = false
properties.member = { description = "The member, by its name in the team's file.", type = "string" }

[team-payer-member.properties.kind]
type = "string"
description = "Who pays: the team's owner, or a named member."
const = "member"

