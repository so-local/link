schema = 1

[defines.ANTHROPIC_API_KEY]
type = "string"
description = "The provider's own key variable, read by `lnk agent start`, `create`, `move` and `model set`: no flag takes a key. With no model yet, the one that is set (several set: refused, to unset all but one); with a hosted model, its provider's, to renew the key; with `--model`, the provider its name says; with a model on this computer, one that is set is asked about in a terminal (switch to that provider?), else said. Never passed to a harness or to a box."

[defines.CURL_CA_BUNDLE]
type = "string"
description = "Certificates curl trusts, which a harness's installer is given."

[defines.LNK_AGENT]
type = "string"
description = "The agent's name, for harness programs."

[defines.LNK_AGENT_FOLDER]
type = "string"
description = "The agent's own folder (`~/Link/Agents/<name>/agent`), for a harness that keeps Link's collections (Link Harness): each one kept at `file` a folder of it."

[defines.LNK_AGENT_ID]
type = "string"
description = "The agent's ID, for harness programs."

[defines.LNK_AGENT_SERVICE]
type = "string"
description = "The service the agent acts as, its bare ID, for harness programs: what its bridge calls prove beside its ID."

[defines.LNK_FALLBACK_CREDENTIAL]
type = "string"
description = "The fallback's key on `lnk agent start --model.fallback_model`, read before its provider's own variable."

[defines.LNK_FILES]
type = "string"
description = "The agent's Home, its files folder, for harness programs."

[defines.LNK_MEASURES]
type = "string"
description = "For harness programs: the file in the harness's home it may append its own measures to, as OTLP (`.lnk/safe/measures/measures.jsonl`), which `lnk measure` reads."

[defines.LNK_OWNER]
type = "string"
description = "The agent's owner, for harness programs."

[defines.LNK_PORT]
type = "string"
description = "The agent's base port, for harness programs: every agent's own."

[defines.LNK_TEST_BRIDGE_NONE_FOR_MS]
type = "string"
description = "Debug builds only: milliseconds an empty shared bridge waits before it stops."

[defines.LNK_TEST_MIGRATE_STOP]
type = "string"
description = "Debug builds only: stop migration before this numbered step so recovery can be tested."

[defines.OPENAI_API_KEY]
type = "string"
description = "The provider's own key variable, read by `lnk agent start`, `create`, `move` and `model set`: no flag takes a key. With no model yet, the one that is set (several set: refused, to unset all but one); with a hosted model, its provider's, to renew the key; with `--model`, the provider its name says; with a model on this computer, one that is set is asked about in a terminal (switch to that provider?), else said. Never passed to a harness or to a box."

[defines.OPENROUTER_API_KEY]
type = "string"
description = "The provider's own key variable, read by `lnk agent start`, `create`, `move` and `model set`: no flag takes a key. With no model yet, the one that is set (several set: refused, to unset all but one); with a hosted model, its provider's, to renew the key; with `--model`, the provider its name says; with a model on this computer, one that is set is asked about in a terminal (switch to that provider?), else said. Never passed to a harness or to a box."

[defines.PIP_CERT]
type = "string"
description = "Certificates pip trusts, which a harness's installer is given."

[defines.REQUESTS_CA_BUNDLE]
type = "string"
description = "Certificates Python's requests trusts, which a harness's installer is given."

