[readers]
"shared::run" = "The variables a shared server is given, from its box."
"run_file::add_with_env" = "The variables a run file's command is given, as its caller names them."
"memory::engine::run" = "The variables the memory engine is given, from its launch."
"machine::forward" = "The model credentials' variables (`settings::key_vars`), removed from a command forwarded to another machine."
"launching::launch_after" = "The variables a launched harness is given, from its box."
"idle::jobs::run_in_terminal" = "The variables a scheduled job's terminal run is given, from its box."
"creating::new_on" = "The model credentials' variables (`settings::key_vars`), never handed to the command making a new agent."
"confine::run_inside" = "The variables a confined run is given, from its box."
"adapter::of_files" = "The variables an adapter is given as it reads its files: its box's, and the harness's port (`PORT_ENV`)."
"adapter::install" = "The variables an adapter's installer is given: where it installs (`exec_variable`) and its box's."
"adapter::command" = "The variables an adapter's command is given: its harness's, from the box it runs in."
"adapter::step::command" = "The variables an adapter's step runs with, and no others: its sandbox's, its harness's and its home's."
"settings::providers::key_in" = "Select the credential variable from the model provider registry or the saved hosted model; refuse ambiguous provider credentials."

[[uses]]
name = "LNK_INSTALLATION_DIR"
access = ["set", "forward"]
context = "runtime"

