[package]
authors.workspace = true
name = "link-webhook-connection"
description = "The webhook module, `lnk-webhook-connection`, checks each post to an agent's own webhooks (`lnk agent webhook`)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lnk-webhook-connection"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[dependencies.link-connection-contract]
workspace = true

[dependencies.link-core]
workspace = true
[dev-dependencies]
# The agent on the mini harness every connection's tests run, from the core
# beside this folder.
link-harness-conformance = { workspace = true }
link-test-kit = { workspace = true }
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["full"] }

# No debug info: it was most of `target/` (a full `cargo test` wrote
# 20 GB with it). A panic still says where it happened; a backtrace names
# functions only.

[build-dependencies]
anyhow.workspace = true
link-actions-build.workspace = true
link-component-build.workspace = true

[dev-dependencies.link-core]
workspace = true

[dependencies.link-machine]
workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies.link-secretive]
workspace = true

[dependencies.link-format]
workspace = true

[dependencies.link-settings]
workspace = true

[dependencies.link-fetch]
workspace = true

[dependencies.link-digest]
workspace = true

[dependencies.clap]
workspace = true

[dependencies.link-spec]
workspace = true

[dependencies.link-actions]
workspace = true
