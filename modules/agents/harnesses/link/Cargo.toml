[package]
authors.workspace = true
name = "link-harness"
description = "Link Harness, `lnk-harness`, is Local Link's own harness, run like any other"
version.workspace = true
edition.workspace = true
license.workspace = true
# One test program, tests/main.rs, with every file a module of it.
autotests = false

[[test]]
name = "harness"
path = "tests/main.rs"

[[bin]]
name = "lnk-harness"
path = "src/main.rs"

[dependencies]
link-interactions.workspace = true
link-agent-contract = {workspace = true, features=["action-client"]}
link-component.workspace = true
link-sandbox-binding.workspace = true
link-api.workspace = true
libc = "0.2"
anyhow = "1"
axum.workspace = true
base64.workspace = true
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml.workspace = true
futures-util = "0.3"

[dependencies.link-harness-contract]
workspace = true

[dependencies.link-measure-contract]
workspace = true

[dependencies.link-agent-identity]
workspace = true

[dependencies.link-model-contract]
workspace = true
features = ["client"]


[dependencies.link-sandbox-bridge]
workspace = true

[dependencies.link-agent-state-protocol]
workspace = true

[dependencies.link-connection-contract]
workspace = true

[dependencies.link-store-contract]
workspace = true
features = ["compact"]

[dependencies.link-agent-spec]
workspace = true

[dependencies.link-harness-wire]
workspace = true

[dependencies.link-memory-tool-contract]
workspace = true

[dependencies.link-scheduler-tool-contract]
workspace = true

[dependencies.link-untrusted]
workspace = true

[dev-dependencies]
link-test-kit.workspace = true
link-agent-contract = { workspace = true, features = ["test-support"] }
link-store-contract = { workspace = true, features = ["test-support"] }
link-core = { workspace = true}
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "json"] }
# The kit every harness is checked with, from the core.
link-harness-conformance = { workspace = true }
# A WebSocket client, for tests/acp.rs.
tokio-tungstenite.workspace = true

# No debug info: it was most of `target/` (a full `cargo test` wrote
# 20 GB with it). A panic still says where it happened; a backtrace names
# functions only.

[build-dependencies]
anyhow.workspace = true
link-actions-build.workspace = true
link-component-build.workspace = true

[dependencies.link-machine]
workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies.link-secretive]
workspace = true

[dependencies.link-format]
workspace = true

[dependencies.link-files]
workspace = true

[dependencies.link-settings]
workspace = true

[dependencies.link-fetch]
workspace = true

[dependencies.link-digest]
workspace = true

[dependencies.clap]
workspace = true

[dependencies.link-spec]
workspace = true

[dependencies.link-actions]
workspace = true

[dependencies.link-types]
workspace = true

[dependencies.link-core]
workspace = true
