[package]
authors.workspace = true
name = "link-harness-hub"
description = "`link-harness-hub` serves a harness's Agent Client Protocol (ACP) over stdio to Local Link's bridges as ACP over a WebSocket, with each thread a session kept across restarts"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.link]
schema = 1
role = "package"
owner = "modules/agents/harnesses/portability/hub"

[dependencies]
link-id.workspace = true
toml.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true, features = ["sink"] }
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["full"] }

[dependencies.link-agent-contract]
workspace = true
features = ["action-client"]

[dependencies.link-component]
workspace = true

[dependencies.link-connection-contract]
workspace = true

[dependencies.link-harness-contract]
workspace = true

[dependencies.link-model-contract]
workspace = true

[dev-dependencies]
link-test-kit.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
tokio-tungstenite.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies.link-format]
workspace = true

[dependencies.link-secretive]
workspace = true

[dependencies.link-files]
workspace = true
