[package]
authors.workspace = true
name = "link-desktop-tool"
description = "Link Desktop (`lnk-desktop-tool`) gives an agent a virtual desktop of its own, which the agent sees as screenshots and works with the mouse and keys"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lnk-desktop-tool"
path = "src/main.rs"

[dependencies]
link-untrusted.workspace = true
link-actions.workspace = true
link-spec.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
anyhow.workspace = true
base64.workspace = true
libc.workspace = true
serde_json.workspace = true
# A screenshot as PNG: its pixels deflated, each chunk's checksum.
flate2 = "1"
crc32fast = "1"
# The X server's protocol, and XTEST's input, in Rust: no Xlib.
x11rb = { version = "0.14", default-features = false, features = ["xtest"] }

[dependencies.link-core]
workspace = true
[build-dependencies]
link-component-build.workspace = true
link-actions-build.workspace = true
anyhow.workspace = true

[dev-dependencies]
link-test-kit.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies.link-secretive]
workspace = true

[dependencies.link-format]
workspace = true

[dependencies.link-settings]
workspace = true

[dependencies.link-types]
workspace = true

[dependencies.link-desktop-tool-contract]
workspace = true
