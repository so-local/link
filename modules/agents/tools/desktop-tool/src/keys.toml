# Keys by name, as models and xdotool name them, to X keysyms: a name is
# matched in any case, so `Return`, `return` and `RETURN` are one key.
# Function keys are counted: `f1` is `function-first`, up to `functions`.
function-first = 0xffbe
functions = 24

[names]
return = 0xff0d
enter = 0xff0d
tab = 0xff09
escape = 0xff1b
esc = 0xff1b
backspace = 0xff08
delete = 0xffff
del = 0xffff
insert = 0xff63
home = 0xff50
end = 0xff57
left = 0xff51
up = 0xff52
right = 0xff53
down = 0xff54
pageup = 0xff55
page_up = 0xff55
prior = 0xff55
pagedown = 0xff56
page_down = 0xff56
next = 0xff56
