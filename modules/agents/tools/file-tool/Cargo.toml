[package]
authors.workspace = true
name = "link-file-tool"
description = "Link File (`lnk-file-tool`) lets an agent `read`, `write`, `edit`, `glob`, and `grep` its files, each call in a sandbox of its own"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lnk-file-tool"
path = "src/main.rs"

[dependencies]
link-untrusted.workspace = true
link-actions.workspace = true
link-spec.workspace = true
clap.workspace = true
serde.workspace = true
link-file-tool-contract.workspace = true
link-agent-contract.workspace = true
link-sandbox-binding.workspace = true
link-sandbox-contract.workspace = true
anyhow.workspace = true
base64.workspace = true
libc.workspace = true
regex.workspace = true
serde_json.workspace = true
toml.workspace = true


[dependencies.link-store-contract]
workspace = true
features = ["files-client"]

[dependencies.link-connection-contract]
workspace = true

[dependencies.link-core]
workspace = true
[dev-dependencies]
link-test-kit.workspace = true
link-store-contract = { workspace = true, features = ["files-bridge", "test-support"] }
# The files bridge's server, which its tests run it against.
# The bridges' server, which serves its tests' storage bridge.
link-sandbox-bridge.workspace = true

[dev-dependencies.link-harness-contract]
workspace = true

[build-dependencies]
link-component-build.workspace = true
link-actions-build.workspace = true
anyhow.workspace = true

[dependencies.link-machine]
workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies.link-digest]
workspace = true

[dependencies.link-files]
workspace = true

[dependencies.link-format]
workspace = true

[dependencies.link-settings]
workspace = true

[dependencies.link-secretive]
workspace = true

[dependencies.link-types]
workspace = true
