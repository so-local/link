[package]
authors.workspace = true
name = "link-document-converter"
description = "Link Document Converter (`lnk-document-converter`) is a module that reads the text of PDFs and Word documents for Link Memory's index"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[[bin]]
name = "lnk-document-converter"
path = "src/main.rs"

[dependencies]
link-actions.workspace = true
link-spec.workspace = true
clap.workspace = true
serde.workspace = true
link-document-converter-contract.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
# A PDF's text, its fonts' encodings read (lopdf, a million downloads and
# more): no font parser or image decoder.
lopdf = { version = "0.45", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dependencies.link-core]
workspace = true

[build-dependencies]
link-component-build.workspace = true
link-actions-build.workspace = true
anyhow.workspace = true

[lints]
workspace = true

[dependencies.link-format]
workspace = true

[dependencies.link-settings]
workspace = true

[dependencies.link-secretive]
workspace = true

[dev-dependencies]
link-test-kit.workspace = true
