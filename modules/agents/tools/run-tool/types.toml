schema = 1

[served]
type = "object"
description = "An MCP session over stdio, ended when its caller closed its input"
additionalProperties = false

[installed]
type = "object"
description = "Nothing installed: this program is the tool"
additionalProperties = false

[gated]
type = "object"
description = "Nothing: gate becomes the command it runs"
additionalProperties = false

[supervised]
type = "object"
description = "A background command run to its end, its ending told to the agent"
additionalProperties = false

[swept]
type = "object"
description = "The background commands looked over, with each whose ending couldn't be told yet"
additionalProperties = false
properties.untold = { type = "array", items = { type = "string" }, description = "Each background command whose ending couldn't be told yet, by its ID" }

[told]
type = "object"
description = "Each background command that ran or whose ending wasn't told yet, a line each"
additionalProperties = false
properties.said = { type = "array", items = { type = "string" }, description = "A line for each" }

[background]
type = "object"
description = "A background command, as a model's list call gives it"
required = ["id", "command", "state", "seconds", "output_bytes", "output"]
additionalProperties = false
properties.id = { type = "string", description = "Its id, which read and stop take" }
properties.command = { type = "string", description = "Its command, as one line" }
properties.state = { enum = ["running", "exited", "signalled", "timed out", "stopped", "lost"], description = "Running, or how it ended" }
properties.exit = { type = "integer", description = "Its exit status, once it exited" }
properties.signal = { type = "integer", description = "The signal that ended it, where one did" }
properties.seconds = { type = "integer", minimum = 0, description = "How long it ran, in seconds" }
properties.output_bytes = { type = "integer", minimum = 0, description = "Its output's size, all of it, in bytes" }
properties.output = { type = "string", description = "Its output's file, in the files folder" }
