schema = 1

[cron]
type = "object"
description = "The machine's calendar starting the scheduler's runner once a minute: launchd on a Mac, the user's crontab elsewhere"
x-link-resource = { id = "label" }
required = ["label"]
additionalProperties = false
properties.label = { type = "string", description = "Its label, the agent's name" }

[fired]
type = "object"
description = "The jobs that were due, fired"
additionalProperties = false

[served]
type = "object"
description = "An MCP session over stdio, ended when its caller closed its input"
additionalProperties = false

[installed]
type = "object"
description = "Nothing installed: this program is the tool"
additionalProperties = false

[scheduled]
type = "object"
description = "A message for later the agent made: what it is, where it goes and when it next fires"
required = ["id", "kind", "thread", "next"]
additionalProperties = false
properties.id = { type = "string", description = "The job's ID" }
properties.kind = { type = "string", description = "What it is: a schedule, a subagent or a message" }
properties.thread = { type = "string", description = "The conversation it goes to" }
properties.next = { type = "string", description = "When it next fires, as a time" }
properties.cron = { type = "string", description = "How often it repeats, as cron says; none when it fires once" }
properties.delegation = { x-link-any = true, description = "What became of a subagent's start where its harness retains delegations" }
properties.warning = { type = "string", description = "Kept, but something after went wrong, such as the machine not told when the jobs are next due: it isn't to be made again" }

[job]
type = "object"
description = "A job of this conversation, as a model's list call gives it: a schedule, a subagent or a message"
required = ["id", "kind", "thread", "text", "next"]
additionalProperties = false
properties.id = { type = "string", description = "Its id, which read and cancel take" }
properties.kind = { enum = ["childmessage", "task", "schedule", "send", "reply", "compact"], description = "What it is" }
properties.thread = { type = "string", description = "The conversation it goes to" }
properties.text = { type = "string", description = "Its message, its first 200 characters" }
properties.next = { type = "string", description = "When it next fires" }
properties.cron = { type = "string", description = "How often it fires, where it repeats" }
properties.after = { type = "array", items = { type = "string" }, description = "The jobs it waits on" }
properties.description = { type = "string", description = "A subagent's short description, as its task call gave it" }
properties.ended = { x-link-any = true, description = "How it ended: done, or why it failed or was cancelled" }

[scheduled-job]
type = "object"
description = "A schedule of this conversation, as the cron namespace lists and deletes it: a job of kind schedule, never a subagent or a message"
required = ["id", "kind", "thread", "text", "next"]
additionalProperties = false
properties.id = { type = "string", description = "Its id, which cron__delete takes" }
properties.kind = { enum = ["schedule"], description = "What it is: always a schedule" }
properties.thread = { type = "string", description = "The conversation it goes to" }
properties.text = { type = "string", description = "Its message, its first 200 characters" }
properties.next = { type = "string", description = "When it next fires" }
properties.cron = { type = "string", description = "How often it fires, where it repeats" }
properties.after = { type = "array", items = { type = "string" }, description = "The jobs it waits on" }
properties.ended = { x-link-any = true, description = "How it ended: done, or why it failed or was cancelled" }
