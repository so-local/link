schema = 1

[served]
type = "object"
description = "An MCP session over stdio, ended when its caller closed its input"
additionalProperties = false

[installed]
type = "object"
description = "Nothing installed: this program is the tool"
additionalProperties = false

[page]
type = "object"
description = "A web page as markdown, a part at a time"
required = ["url", "text", "start", "cut"]
additionalProperties = false
properties.url = { type = "string", description = "The page's address, after any redirect" }
properties.title = { type = "string", description = "Its title, where it has one" }
properties.text = { type = "string", description = "The part read, as markdown" }
properties.start = { type = "integer", minimum = 0, description = "The byte this part starts at" }
properties.next = { type = "integer", minimum = 0, description = "The byte the next part starts at, where more is left" }
properties.cut = { type = "boolean", description = "Whether the page passed the most read of one page, so only its start was read" }

[hit]
type = "object"
description = "One result of a web search"
required = ["title", "url", "snippet"]
additionalProperties = false
properties.title = { type = "string", description = "The page's title, as the search API gives it" }
properties.url = { type = "string", description = "Its address" }
properties.snippet = { type = "string", description = "The words the search API shows for it" }
properties.age = { type = "string", description = "How old the page is, where the search API says" }

[results]
type = "object"
description = "What a web search found"
required = ["hits"]
additionalProperties = false
properties.hits = { type = "array", items = "hit", description = "Its results, best first" }
