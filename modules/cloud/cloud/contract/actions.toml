schema = 1

# The protocol every cloud adapter answers, declared once: `lnk box`,
# `lnk storage`, `lnk cloud` and the agent call an adapter of any kind
# the same way, its request on standard input and its reply on standard
# output. Each adapter lists the actions it answers under [implements].

[verbs]
storage = { description = "Say what reaches the account's own buckets, as the account", effect = "find" }
defaults = { description = "Say the machine type and place a box gets when its specification names neither", effect = "find" }
sizes = { description = "List the machine types a box can be in a place, with the place's rates", effect = "find" }
launch = { description = "Make a machine as a box's resolved specification says", effect = "insert" }
wait = { description = "Wait until a machine runs and say its address", effect = "find" }
state = { description = "Say a machine's state and address", effect = "find" }
describe = { description = "Say what a machine is: its size, disk, OS and whether it's spot", effect = "find" }
hostkeys = { description = "Read a machine's SSH host keys from its console", effect = "find" }
cleanup = { description = "Delete what a box left in the account once its machine is gone", effect = "delete" }
save-hostkeys = { description = "Keep a machine's SSH host keys where the next run finds them", effect = "update" }
add-key = { description = "Let an SSH public key into a machine for a while", effect = "insert" }
remove-keys = { description = "Take every SSH key added to a machine out", effect = "delete" }
tag = { description = "Add tags to a machine and its disk", effect = "update" }
label = { description = "Add labels to a bucket", effect = "update" }
buckets = { description = "List the account's buckets by their labels", effect = "find" }
upload-once = { description = "Sign a write-once upload of one object into a bucket", effect = "find" }
delete-objects = { description = "Delete objects of a bucket by their names", effect = "delete" }
object-read = { description = "Read one object of a bucket", effect = "find" }
bucket-credential = { description = "Make a credential that reaches one bucket alone", effect = "insert" }
revoke-key = { description = "Revoke the keys made for a bucket", effect = "delete" }
image-save = { description = "Save a stopped machine's disk as an image", effect = "insert" }
image-list = { description = "List the account's images by their tags", effect = "find" }
image-remove = { description = "Delete an image", effect = "delete" }
tunnel = { description = "Carry a box's SSH stream through its cloud account", effect = "insert" }

[actions."cloud-contract.cloud-contract.add-key"]
description = "Answer the cloud adapter contract's add-key request on standard input."
role = "plumbing"
output = "reply"

