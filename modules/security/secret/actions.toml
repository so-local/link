schema = 1

[verbs]
bootstrap = { description = "For a box's boot launcher: receive a sealed handoff and keep its restart credential", effect = "insert" }
bridge = { description = "Add secrets to a sandbox's calls to the services they're for, on a socket", effect = "insert" }
keep = { description = "Run the keeper itself, as its service does", effect = "insert" }
pass = { description = "Use a secret sealed: a proxy outside the caller adds it to the caller's requests for its one host", effect = "find" }
read = { description = "Read a secret's value, its owner alone", effect = "find" }
write = { description = "Change a secret's value, keeping its ID and every grant", effect = "update" }

# A secret's sealed use, given by an assignment its owner sees and removes:
# `secret.secret.add` and `remove` add and remove assignments of it.
[roles.passer.secret.secret]
pass = ["*"]

[actions."secret.secret.add"]
description = """
Give a secret kept (`lnk secret create`) to a workload here, such as an
agent (`--to agent:main`), once for each flag: the grant names the service
it acts as

A workload is given a secret sealed only, with --internet-host, and is
told a placeholder, never the value.
"""
resource = "secret"
role = "secondary"
docs = "/config/secrets#grant-access-to-a-secret"
output = "granted"
next = ["secret.secret.list"]
fail = ["secret.secret.create", "secret.secret.list"]

[actions."secret.secret.add".args]
secret = { type = "string", description = "The secret's name, or its ID, secret:<id> (`lnk secret list`)", required = true, x-link-cli = { position = 1 } }
to = { type = "array", items = { type = "string" }, minItems = 1, description = "A workload here it is given to, <kind>:<name> (agent:main), once for each", required = true }

[actions."secret.secret.bootstrap"]
description = "For a box's boot launcher: receive a sealed handoff and keep its restart credential"
role = "plumbing"
output = "ended"

[actions."secret.secret.bootstrap".args]
file = { type = "string", x-link-path = true, description = "The private restart credential, sealed to the required TPM", required = true }
instance = { type = "string", description = "The instance whose boot credentials are being received", required = true }

[actions."secret.secret.bridge"]
description = """
For `lnk sandbox proxy`: add your secrets to a sandbox's calls to the
services they're for, on a socket, until none comes for a while (a proxy
starts it)
"""
role = "plumbing"
output = "ended"

[actions."secret.secret.bridge".args]
keys = { type = "string", x-link-path = true, description = "The keyring each call is proved against", required = true }
runtime = { type = "string", x-link-path = true, description = "The runtime folder its sockets are in", required = true }
settings = { type = "string", x-link-path = true, description = "Link's settings, whose user it serves", required = true }
socket = { type = "string", x-link-path = true, description = "Its socket, where a proxy calls it", required = true }

[actions."secret.secret.create"]
description = """
Keep a secret: its value asked without echo, or read from its input's
first line, given to no one yet (`lnk secret add`)

With --internet-host it's sealed: given only to the sandbox's proxy, which
adds it to requests for that host alone, as an agent is given one. It
prints the secret's ID, secret:<id>, which no other secret is ever given.
Creating a secret again replaces it whole, under a new ID: its value, how
it's given and every grant.
"""
role = "secondary"
docs = "/config/secrets#create-a-secret"
output = "kept"
stdin = "value"
next = ["secret.secret.add", "secret.secret.list"]
fail = ["secret.secret.list", "secret.keeper.create"]

[actions."secret.secret.create".args]
name = { type = "string", description = "The secret's name, a variable's (`NPM_TOKEN`)", required = true, x-link-cli = { position = 1 } }
internet-host = { type = "string", description = """
The one host the proxy adds it to requests for (api.stripe.com); left
out, it's kept plain, for what a module keeps alone
""" }
header = { type = "string", description = """
The header it goes in: Authorization, or one named for an API key
(X-Api-Key) [default: Authorization]
""" }
format = { type = "string", description = """
The header's value, {} where the secret goes [default: Bearer {} for
Authorization, Basic {} with --basic-user, {} for any other]
""" }
basic-user = { type = "string", description = """
The user name of HTTP Basic's credentials, with the secret as its password:
the base64 of <user>:<secret>, as git over HTTPS takes a token
(x-access-token for GitHub)
""" }
yes = { x-link-cli = { shared = "yes" } }
json = { x-link-cli = { shared = "json" } }

[actions."secret.secret.delete"]
description = """
Delete a secret, by its name or its ID (secret:<id>), from this machine,
its value and its grants, and from each box a move gave a copy to; its ID
is never given again

A box it can't reach (stopped, or offline) stays noted, and delete exits
non-zero until a later run reaches it. A copy on a cloud account that
hosts agents goes with the agent there, and stays noted until then.
"""
resource = "secret"
role = "secondary"
docs = "/config/secrets#an-agent-that-leaves"
output = "deleted"
checks = ["one_secret_to_delete"]
next = ["secret.secret.list"]
fail = ["secret.secret.list", "secret.secret.delete"]

[actions."secret.secret.delete".args]
secret = { type = "string", description = "The secret's name, or its ID (secret:<id>)", x-link-cli = { position = 1 } }
here = { type = "boolean", description = """
From this machine alone, and nothing to remove isn't an error: what
remove runs on each box
""" }
service = { type = "string", format = "link-id", x-link-kind = "service", description = "With --here and --own: the own secret of this service (service:<id>), as `lnk secret delete` runs it on a box given a copy", x-link-cli = { hidden = true } }
own = { type = "string", description = "With --service: which of the service's own secrets, by its purpose (model)", x-link-cli = { hidden = true } }
json = { x-link-cli = { shared = "json" } }

[actions."secret.secret.keep"]
description = "The keeper itself, as its service runs it: as lnk-secrets alone"
role = "plumbing"
output = "ended"
fail = ["secret.keeper.create"]

[actions."secret.secret.keep".args]
socket = { type = "string", x-link-path = true, description = "Where it answers [default: /run/lnk-secrets/keeper.sock]" }
store = { type = "string", x-link-path = true, description = "Where it keeps each user's store [default: /var/lib/lnk/secret]" }

[actions."secret.keeper.create"]
description = """
Keep your secrets under a user of their own (lnk-secrets), which no
program of yours runs as: made once, with sudo

Linux, with systemd: makes the user, puts this lnk-secret in its place
(root's), and starts its service, lnk-secrets, which answers on a socket
outside every sandbox and gives each user their own secrets alone. Your
secrets move to it. Run again after an upgrade, to put the new lnk-secret
in place.
"""
role = "secondary"
docs = "/config/secrets/keeper#create-the-keeper"
output = "ended"
next = ["secret.secret.create", "secret.secret.list"]
fail = ["secret.secret.list", "secret.keeper.create"]

[actions."secret.keeper.create".args]
yes = { x-link-cli = { shared = "yes" } }

[actions."secret.secret.list"]
description = """
List every secret kept here, credentials among them: each secret's name,
how it's given and where it's granted, and where each secret another
module holds is kept and what it may do, never a value
"""
role = "secondary"
docs = "/config/secrets/more/contract#listed-for-lnk-secret-list"
output = "listed"
next = [
    "secret.secret.create",
    "secret.secret.add",
    "secret.secret.show",
    "secret.secret.remove",
    "secret.secret.delete",
    "secret.keeper.create",
]

[actions."secret.secret.list".args]
to = { type = "string", description = "Only the secrets given to this workload, <kind>:<name> (agent:main)" }
json = { x-link-cli = { shared = "json" } }

[actions."secret.secret.remove"]
description = "Stop giving a secret to a workload: it stays kept, and given to the rest"
resource = "secret"
role = "secondary"
docs = "/config/secrets#who-a-grant-names"
output = "granted"
next = ["secret.secret.list"]
fail = ["secret.secret.remove", "secret.secret.list"]

[actions."secret.secret.remove".args]
secret = { type = "string", description = "The secret's name, or its ID, secret:<id> (`lnk secret list`)", required = true, x-link-cli = { position = 1 } }
to = { type = "array", items = { type = "string" }, minItems = 1, description = "A workload here it is no longer given to, <kind>:<name> (agent:main), once for each", required = true }

[actions."secret.secret.show"]
diagnoses = "secret"
description = "Show how one secret is given and where it is granted, never its value"
resource = "secret"
role = "secondary"
docs = "/config/secrets#inspect-your-secrets"
next = ["secret.secret.list"]
fail = ["secret.secret.list"]

[actions."secret.secret.show".args]
secret = { type = "string", description = "The secret's name, or its ID, secret:<id> (`lnk secret list`)", required = true, x-link-cli = { position = 1 } }
json = { x-link-cli = { shared = "json" } }

[actions."secret.secret.pass"]
description = "Use a secret sealed: a proxy outside the caller adds it to the caller's requests for its one host, and the caller never sees it"
resource = "secret"
role = "secondary"
output = "secret"
surfaces = ["rest"]

[actions."secret.secret.pass".args]
secret = { type = "string", format = "link-id", x-link-kind = "secret", description = "The secret, by its ID, secret:<id>", required = true }

[actions."secret.secret.read"]
description = "Read a secret's value, for its owner alone"
resource = "secret"
role = "secondary"
output = "secret-value"
surfaces = ["rest"]

[actions."secret.secret.read".args]
secret = { type = "string", format = "link-id", x-link-kind = "secret", description = "The secret, by its ID, secret:<id>", required = true }

[actions."secret.secret.write"]
description = "Change a secret's value, keeping its ID and every grant on it"
resource = "secret"
role = "secondary"
output = "secret"
surfaces = ["rest"]

[actions."secret.secret.write".args]
secret = { type = "string", format = "link-id", x-link-kind = "secret", description = "The secret, by its ID, secret:<id>", required = true }
value = { type = "string", description = "Its new value, sent in the request's body, never a URL", required = true }
