schema = 1

[secret]
type = "object"
description = "A secret kept here: how it's given and where it's granted, never its value"
x-link-resource = { id = "resource" }
required = ["resource", "kind", "to", "copies", "kept"]
additionalProperties = false
properties.resource = { type = "string", format = "link-id", x-link-kind = "secret", description = "Its ID" }
properties.kind = { enum = ["named", "own"], description = "Which kind of secret: named, kept by lnk secret create, or a service's own" }
properties.name = { type = "string", description = "Its name: a named secret's alone" }
properties.owner = "owner"
properties.host = { type = "string", description = "The one host the proxy adds it to requests for; left out for a plain secret" }
properties.header = { type = "string", description = "The header a sealed secret goes in" }
properties.format = { type = "string", description = "The header's value, {} where the secret goes" }
properties.basic = { type = "string", description = "The user name of HTTP Basic's credentials, with the secret as its password" }
properties.to = { type = "array", items = "grant", description = "Each grant: who it's given to" }
properties.copies = { type = "array", items = "place", description = "Each place a move gave a copy of it to" }
properties.kept = { type = "boolean", description = "Whether it's kept here: false for one gone from here with copies left elsewhere" }

[owner]
type = "object"
description = "Whose own secret it is: the agent's service, and the secret's use"
required = ["principal", "as"]
additionalProperties = false
properties.principal = { type = "string", format = "link-id", x-link-kind = "service", description = "The service the agent acts as" }
properties.as = "use"

[grant]
type = "object"
description = "Who a secret is given to: a principal, an action and a resource, the service an agent acts as, what it may do and the secret, with how it's given"
required = ["principal", "action", "resource", "workload", "name", "as"]
additionalProperties = false
properties.principal = { type = "string", format = "link-id", x-link-kind = "service", description = "The service the agent acts as" }
properties.action = { enum = ["secret.secret.pass", "secret.secret.read"], description = "What it may do with the secret: pass a sealed one, read a plain one" }
properties.resource = { type = "string", format = "link-id", x-link-kind = "secret", description = "The secret given" }
properties.workload = { type = "string", format = "link-id", x-link-kind = "agent", description = "The agent acting as its principal, to show: it grants nothing" }
properties.name = { type = "string", description = "The agent's name as it was granted, to show" }
properties.as = "use"

[use]
description = "How a secret is given, by its kind: as a variable, or as one of a service's own secrets for a purpose"
oneOf = ["use-variable", "use-own"]
examples = [{ kind = "variable" }, { kind = "own", purpose = "model" }]

[use-variable]
type = "object"
description = "As a variable of the secret's name"
required = ["kind"]
additionalProperties = false
properties.kind = { const = "variable" }

[use-own]
type = "object"
description = "As one of a service's own secrets, for its purpose"
required = ["kind", "purpose"]
additionalProperties = false
properties.kind = { const = "own" }
properties.purpose = { type = "string", description = "Which of the agent's own secrets (model, fallback, connection:<connection>:<field>, webhook:<name>)" }

[place]
type = "object"
description = "A place a move gave a copy of a secret to"
required = ["name", "cloud"]
additionalProperties = false
properties.name = { type = "string", description = "A box's name, or a cloud account's that runs agents" }
properties.cloud = { type = "boolean", description = "Whether it's a cloud account rather than a box" }
properties.resource = { type = "string", format = "link-id", x-link-kind = "box", description = "A box's machine" }

[credential]
type = "object"
description = "A secret another module keeps on this machine, most often a credential, never its value"
required = ["what", "kept", "may"]
additionalProperties = false
properties.what = { type = "string", description = "What it is" }
properties.of = { type = "string", description = "Whose or which; left out when it's no one's in particular" }
properties.kept = { type = "string", description = "Where it's kept" }
properties.may = { type = "string", description = "What it may do" }

[value]
type = "string"
description = "A secret's value, read from the first line of stdin when no terminal asks for it"
x-link-sensitive = true

[kept]
type = "object"
description = "The secret kept, by its ID"
required = ["resource"]
additionalProperties = false
properties.resource = { type = "string", format = "link-id", x-link-kind = "secret", description = "Its ID, which no other secret is ever given" }

[granted]
type = "object"
description = "A secret given where it wasn't, or no longer given where it was: said, with no answer of its own"
additionalProperties = false

[listed]
type = "object"
description = "Every secret kept here and, without --to, every secret the other modules keep on this machine"
required = ["secrets", "credentials"]
additionalProperties = false
properties.secrets = { type = "array", items = "secret" }
properties.credentials = { type = "array", items = "credential" }

[deleted]
type = "object"
description = "What deleting a secret removed: here, and from each copy a move gave"
required = ["removed", "copies", "left"]
additionalProperties = false
properties.resource = { type = "string", format = "link-id", x-link-kind = "secret", description = "Its ID; left out when none was kept" }
properties.removed = { type = "boolean", description = "Whether it was kept here" }
properties.copies = { type = "array", items = "place", description = "Each place its copy is gone from" }
properties.left = { type = "array", items = "place", description = "Each place a copy stays" }

[ended]
type = "object"
description = "A run that ended, said with no answer of its own"
additionalProperties = false

[keeper]
type = "object"
description = "The user your secrets are kept under, which no program of yours runs as"
required = ["user"]
additionalProperties = false
properties.user = { type = "string", description = "The keeper's system user" }

[secret-value]
type = "object"
description = "A secret's value, as its owner reads it"
required = ["resource", "value"]
additionalProperties = false
properties.resource = { type = "string", format = "link-id", x-link-kind = "secret", description = "Its ID" }
properties.value = { type = "string", description = "Its value" }

