schema = 1

[defines.LNK_TEST_BOOTSTRAP]
type = "string"
description = "Debug builds only: permit the bootstrap test launcher to receive box credentials without root."

[defines.LNK_TEST_TPM_DEVICE]
type = "string"
description = "Debug builds only: TPM device path used in place of `/dev/tpmrm0`."

[[uses]]
name = "LNK_TEST_KEEPER"
access = ["read"]
context = "runtime"

[[uses]]
name = "LNK_SUDO"
access = ["read"]
context = "runtime"
