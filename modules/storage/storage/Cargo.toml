[package]
authors.workspace = true
name = "link-storage"
description = "The storage module (`lnk-storage`) keeps your files (`~/Link/Files`) and each owner's folder, one another module says is its own"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lnk-storage"
path = "src/main.rs"
test = false

[dependencies]
libc.workspace = true
anyhow.workspace = true
clap.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
link-id.workspace = true
tokio.workspace = true
toml.workspace = true
# A folder a cloud account keeps goes through that account, as a stream
# of the move's format (`link_core::moving`).
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dependencies.link-cloud-contract]
workspace = true



[dependencies.link-core]
workspace = true

[build-dependencies]
link-component-build.workspace = true
link-actions-build.workspace = true
anyhow.workspace = true

[dev-dependencies.link-test-kit]
workspace = true

[dependencies.link-storage-contract]
workspace = true

[dependencies.link-machine]
workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies.link-format]
workspace = true

[dependencies.link-secretive]
workspace = true

[dependencies.link-spec]
workspace = true

[dependencies.link-files]
workspace = true

[dependencies.link-settings]
workspace = true

[dependencies.link-digest]
workspace = true

[dependencies.link-runtime]
workspace = true

[dependencies.link-artifact]
workspace = true

[dependencies.link-keychain]
workspace = true

[dependencies.link-fetch]
workspace = true

[dependencies.link-actions]
workspace = true

[dependencies.link-types]
workspace = true
