# What every generator of link-actions-surfaces writes the same way:
# its marker, the API's paths, and where each surface's files go.

[generator]
# The line every generated file carries, which the freshness check reads
# to tell a generated file from one a person wrote.
marker = "Generated by link-actions-surfaces from the module declarations: change those and regenerate, never this file."
# The top-level key a generated JSON file holds the marker under.
json-key = "x-link-generator"

[openapi]
version = "3.1.0"
title = "Link"
# The document's own version: the API's, stated here, never the
# generator's build.
api-version = "0.1.0"
# Every action is a request to <prefix>/<namespace>/<resource>/<verb>,
# its method and formats link-actions' transport.toml derives.
prefix = "/_link"
file = "openapi.json"

[surfaces]
# Core's shared runtime arguments that shape only what the command line
# prints, left out of the API, the app, and agents' tools, which always
# answer JSON.
cli-only = ["json"]
# Core's shared runtime arguments a person answers, left out of agents'
# tools, so a model never says yes for the person to what a command
# would ask.
person-only = ["yes"]

[typescript]
types = "types.ts"
client = "client.ts"

# The Rust client's files, each included by the crate holding the client.
[rust]
types = "types.rs"
client = "client.rs"
handler = "handler.rs"

[app]
# Each action's page, under the app's route folder, at
# <namespace>/<resource>/<verb>.tsx.
extension = "tsx"

[tools]
file = "tools.json"
# Joins an action ID's three words into a tool's name, which allows no
# dot. Names are lowercase letters, digits and dashes, so it can't clash.
separator = "_"
max-name = 64
# The parameter holding the action's spec, beside its arguments.
spec = "spec"

[reference]
# Each module's pages, from its own folder: its commands under the hub's
# address, so the hub introduces each one.
commands = "docs/more/reference/modules"
specs = "docs/config/specs"
# The page linking every module's commands, and the variable index, from
# the workspace's root.
hub = "docs/more/reference/modules.md"
# The fence a command's synopsis is in: no terminal's, since its
# brackets and placeholders make it no command to run.
synopsis = "usage"
# The hook under the hub's title, a page with pages under it.
hub-hook = "Every Module's Commands"
# A module in modules/<domain>/ or interop/<domain>/ has its page under
# its domain's hub, so the hub's pages stay few as modules grow.
domains = ["modules", "interop"]
domain-hook = "Each Module of One Domain"
variables = "docs/more/reference/variables.md"
# A word of a name a heading writes out in full, as the docs' prose
# does: the command line's `spec` is a heading's Specification.
spelled-out = { spec = "Specification", specs = "Specifications" }
# A word of a name that is an acronym, which a heading writes in capitals,
# as the docs' prose does: the module `mcp` is a heading's MCP.
acronyms = ["acp", "api", "aws", "cli", "cpu", "dns", "gcp", "gpu", "http", "iam", "id", "json", "mcp", "os", "qa", "qemu", "rest", "sql", "ssh", "tls", "toml", "ui", "url", "vm"]

[completion]
# The completion scripts for `lnk`, from the workspace's root: among the
# scripts a person sources, which a release reads from the workspace.
bash = "scripts/completion/lnk.bash"
zsh = "scripts/completion/lnk.zsh"
# How each is read, said at its top.
bash-comment = "Completion for lnk in bash 4 or later: source this file from ~/.bashrc."
zsh-comment = "Completion for lnk in zsh: source this file from ~/.zshrc, after compinit."
# The help of a bound action's `--spec` where its arguments don't declare
# one, as its parser adds it.
spec-help = "The spec file, its fields overridden by field flags"
# Before the commands a group's word holds, its help.
group-help = "Commands:"
