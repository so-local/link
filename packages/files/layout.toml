# Every fixed Link-owned location and its trust boundary. Callers use typed IDs.
[roots]
home = "Link"
hidden = ".lnk"

[boundaries]
hidden-safe = "safe"
home-safe = "Safe"
exec = "exec"
data = "data"
core = "link"

[temporary]
prefix = "lnk-tmp-"
max-age-seconds = 604800
sweep-period-seconds = 86400

# The folders of each of this owner's things, in `~/.lnk/data/<owner>/<name>/`:
# what it keeps while it runs that isn't its state, so never under `~/Link`.
[agents]
harness-homes = "harnesses"
browser = "browser"
desktop = "desktop"
background = "run"
caches = "caches"

[memory-service]
working = "run"
input-prefix = "agents-"
input-suffix = ".json"

# Where an owner's memory service reaches each of its storage bridges:
# `<memory-sockets>/<owner's digest>/<bridge's key>/<socket>`, in the
# runtime folder. The owner is named by the first `owner-digest` hex
# characters of its SHA-256, never in full: an owner's name may be 64
# bytes, and the whole path must fit a socket's 103 (macOS) or 107 (Linux).
[memory-bridges]
owner-digest = 16
socket = "storage.sock"

# Sockets live here, so its path stays short: macOS's `sun_path` holds 104
# bytes, and a Mac's `$TMPDIR` alone is about 50. Without a system runtime
# folder it is `<fallback>/<fallback-prefix><uid>`, never under `$TMPDIR`.
[runtime-root]
folder = "lnk"
linux = "/run/user"
fallback = "/tmp"
fallback-prefix = "lnk-run-"

[installation]
exec-variable = "LNK_EXEC_DIR"

[owner-files]
seen-specs = "seen.toml"

[trusted-read]
system-links = ["/etc", "/tmp", "/var", "/var/run"]

# Each owner's one folder in every part, named by its plural word: Title
# Case directly in ~/Link and in its mirror ~/Link/Safe (~/Link/Boxes,
# ~/Link/Safe/Models), lowercase in ~/.lnk and in every folder below those
# (~/Link/Safe/Sandboxes/presets). `parts` lists
# where it has a folder; one missing from a part is declared one-sided
# there. `link` is Link's own, whose files sit at each part's root. An owner
# outside this catalogue declares its own folders in its own
# `locations.toml` (`HiddenPlace`).
# `kind` is the word for one of its things, as an archive selects it
# (`box.dev`), and `state` the parts whose folder of a thing is its
# state: only parts under ~/Link, where nothing but state is kept.
[owners]
agents = { module = "agent", kind = "agent", parts = ["link", "link-safe", "safe", "data", "exec"], state = ["link", "link-safe"] }
teams = { module = "agent", kind = "team", parts = ["link", "link-safe", "safe", "data"], state = ["link"] }
boxes = { module = "box", kind = "box", parts = ["link", "safe"], state = ["link"] }
models = { module = "model", parts = ["link-safe", "safe", "data"], state = ["link-safe"] }
sandboxes = { module = "sandbox", parts = ["link-safe", "safe"], state = ["link-safe"] }
secrets = { module = "secret", parts = ["safe"] }
harnesses = { module = "agent", parts = ["data", "exec"] }
measures = { module = "measure", parts = ["safe", "data"] }
envs = { module = "env", parts = ["safe"] }
clouds = { module = "cloud", parts = ["safe"] }
storage = { module = "storage", parts = ["safe"] }
aws = { module = "aws", parts = ["safe"] }
gcp = { module = "gcp", parts = ["safe"] }
bundles = { module = "bundle", parts = ["safe", "data"] }

[home]
agents = { path = "Agents", kind = "data", owner = "agents" }
teams = { path = "Teams", kind = "data", owner = "teams" }
boxes = { path = "Boxes", kind = "data", owner = "boxes" }
files = { path = "Files", kind = "data", owner = "link" }
archive = { path = "Archive", kind = "data", owner = "link" }
logs = { path = "Logs", kind = "data", owner = "link" }
safe = { path = "Safe", kind = "control", owner = "link" }
marker = { path = "Safe/folder.toml", kind = "control", owner = "link" }
settings = { path = "Safe/settings.toml", kind = "control", owner = "link" }
agent-settings = { path = "Safe/Agents", kind = "control", owner = "agents" }
