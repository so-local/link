sandbox-program = { root = "exec", path = "lnk-sandbox", kind = "exec" }
secret-store = { root = "state", path = "secret", kind = "control" }
# The state root's data part: what a run may be granted, an owner's in its
# own folder, by its plural word, as in ~/.lnk/data.
data = { root = "state", path = "data", kind = "data" }
