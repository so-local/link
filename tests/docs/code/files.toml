# The repository's file kinds: one catalogue that the Repository Files
# reference, its generated inventory and each kind's generated notice
# are read from (`src/files.rs`). A tracked TOML file belongs to the
# first kind that matches it; one no kind matches fails the docs checks.
#
# A kind matches by `names` (the file's name), `paths` (a path from the
# workspace's root, or a folder ending in `/`), `segments` (a folder
# anywhere in its path) or `package` (any other file in a package's
# folder). `notice` is what the kind's generated header says the file
# is; a kind without one gets no header.

[[kind]]
id = "cargo-manifest"
title = "Cargo.toml"
names = ["Cargo.toml"]
purpose = "A package's or the workspace's Cargo metadata: its name, author, license, dependencies and Link's own `[package.metadata.link]`"
reader = "Cargo, and the repository and docs checks"

[[kind]]
id = "cargo-lock"
title = "Cargo.lock"
names = ["Cargo.lock"]
purpose = "The workspace's locked dependency versions, written by Cargo"
reader = "Cargo, and the dependency checks"

[[kind]]
id = "component"
title = "module.toml"
names = ["module.toml"]
purpose = "A module's component declaration: its id, kind, menu, removal, dependencies and requirements"
reader = "`link-component`, embedded by `link-component-build`"
notice = "declares this component and its requirements"

[[kind]]
id = "layer"
title = "layer.toml"
names = ["layer.toml"]
purpose = "A group folder's layer: the group folders it is built on"
reader = "the docs checks' `layers` rule"
notice = "declares this group's repository boundaries"

[[kind]]
id = "actions"
title = "actions.toml"
names = ["actions.toml"]
purpose = "A program's commands: each action keyed by its ID, its runtime arguments, bound specification and output"
reader = "`link-actions`, generated by `link-actions-build`, and `link-component`, embedded by `link-component-build`"

[[kind]]
id = "types"
title = "types.toml"
names = ["types.toml"]
purpose = "A module's shapes, its specification kinds and outputs among them, each named once in JSON Schema's terms"
reader = "`link-actions`, generated into Rust by `link-actions-build`"

[[kind]]
id = "harness-variables"
title = "A harness's variables"
paths = ["modules/agents/agent/src/migrating/variables.toml"]
purpose = "Every variable Link knows in a harness's `.env`, and what `lnk agent migrate` makes of it"
reader = "`link-agent`"

[[kind]]
id = "variables"
title = "variables.toml"
names = ["variables.toml"]
purpose = "The environment variables a crate defines, each once, and every one it reads, sets, removes, or hands a child, with its namespaces and reader functions"
reader = "`link-actions`; `link-component-build` embeds a module's definitions as its program's inputs"

[[kind]]
id = "toolchain"
title = "rust-toolchain.toml"
names = ["rust-toolchain.toml"]
purpose = "The compiler and components the workspace builds with"
reader = "rustup"

[[kind]]
id = "cargo-config"
title = ".cargo/config.toml"
paths = [".cargo/config.toml"]
purpose = "Cargo's settings for this workspace, such as the test threads and the check aliases"
reader = "Cargo"

[[kind]]
id = "checks"
title = ".cargo/checks.toml"
paths = [".cargo/checks.toml"]
purpose = "The steps of the workspace's full and session checks, in order, and what each needs"
reader = "`lnk-check`, run as `cargo full-check` and `cargo session-check`"

[[kind]]
id = "clippy"
title = "clippy.toml"
names = ["clippy.toml"]
purpose = "Clippy's settings, such as the methods a test may not call"
reader = "Clippy"

[[kind]]
id = "spec-case"
title = "Specification cases"
paths = ["tests/specs/"]
purpose = "One case of a specification each: the specification as a user writes it and what must come of it"
reader = "each specification's owning crate's tests, and the docs code checks"

[[kind]]
id = "repository-policy"
title = "Repository policy"
paths = ["tests/docs/", "tests/repository/"]
purpose = "The repository and docs checks' lists and limits: approved exceptions, which may only shrink"
reader = "`link-docs-check` and `link-repository-check`"

[[kind]]
id = "test-input"
title = "Test inputs"
segments = ["tests", "fixtures"]
purpose = "What a package's tests read: cases, fixtures and expected results"
reader = "the owning package's tests"

[[kind]]
id = "release-input"
title = "Release inputs"
paths = ["scripts/"]
purpose = "What sealing a release reads, such as accepted advisories"
reader = "`link-bundle`"

[[kind]]
id = "owned-data"
title = "Owned values"
package = true
purpose = "A package's own values, defaults, schemas and pins, read once into a type and checked by a test"
reader = "the owning package"
