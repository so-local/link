# The shapes of other companies' credentials, which no tracked file in
# the public tree may hold, not even a made-up one for a test:
# GitHub's push protection refuses a push holding one, and has no list
# of exceptions, so this one has none either (the rule is
# `link_repository_check::credentials`). A test that needs a
# credential-shaped value builds it from parts, with `concat!` or
# `format!`, so its source never matches. Each shape is a Rust
# `regex`, by the provider whose credential it is.

[shapes]
anthropic = 'sk-ant-(api|admin)[0-9]{2}-[A-Za-z0-9_-]{80,}'
aws = '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
discord = '\b[MNO][A-Za-z0-9_-]{23,27}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,}'
github = '\b(gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,})'
google = '\bAIza[0-9A-Za-z_-]{35}\b'
npm = '\bnpm_[A-Za-z0-9]{36}\b'
openai = '\bsk-[A-Za-z0-9_-]{20,}T3BlbkFJ[A-Za-z0-9_-]{20,}'
slack = '\b(xox[abposre]-[0-9A-Za-z-]{10,}|xapp-[0-9]-[A-Za-z0-9-]{10,})|hooks\.slack\.com/services/T[A-Za-z0-9]+/B[A-Za-z0-9]+/[A-Za-z0-9]+'
stripe = '\b[rs]k_live_[0-9A-Za-z]{24,}'
telegram = '\b[0-9]{5,16}:A[A-Za-z0-9_-]{32,34}\b'
