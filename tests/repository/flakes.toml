# Flaky tests met in tests a change didn't write: each fails and then
# passes on one build with nothing changed. The check sorts a listed
# test's failure apart, so a run meeting it goes on. Whoever takes this
# list fixes each at its cause, proves the fix with
# `cargo test-copies -p <package> <test>`, and takes its entry out
# (`link_repository_check::flakes`; the lifecycle is Testing's Flakes).
