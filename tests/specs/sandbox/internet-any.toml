# Any public host, and never this machine, its network or a metadata
# service, however the address is written.
[spec]
schema = 1
[spec.internet]
hosts = ["*"]
[spec.commands]
toolchains = ["shell"]

[expect]
reaches = ["example.com", "example.org:443"]
refused = [
    "127.0.0.1:22",
    "localhost:22",
    "[::1]:22",
    "[::ffff:127.0.0.1]:22",
    "[64:ff9b::7f00:1]:22",
    "[2002:7f00:1::1]:22",
    "169.254.169.254:80",
    "[::ffff:169.254.169.254]:80",
    "[64:ff9b::a9fe:a9fe]:80",
    "[2002:a9fe:a9fe::1]:80",
    "2852039166:80",
    "10.0.0.1:443",
    "192.168.1.1:443",
    "[fd00::1]:443",
    "100.64.0.1:443",
    "example.com:22",
]
runs = ["sh", "ls", "id"]
